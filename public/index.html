<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VENZNOVA — NIFT/CONNECT</title>

<meta
  name="description"
  content="VENZNOVA — NIFT student, senior, alumni and client network for projects, assignments, doubts, opportunities and connections."
>

<style>
:root{
  --bg:#07090d;
  --panel:#0d1118;
  --panel2:#111721;
  --line:#27303d;
  --text:#f6f7fb;
  --muted:#8d98a9;
  --lime:#b7ff00;
  --pink:#ff2da0;
  --cyan:#20d9ff;
  --danger:#ff6178;
  --max:1240px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 8% 15%,
      rgba(255,45,160,.11),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 55%,
      rgba(183,255,0,.10),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.app{
  min-height:100vh;
}

/* =========================
   NAVIGATION
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:76px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(7,9,13,.88);
  backdrop-filter:blur(18px);
}

.nav{
  height:100%;
  max-width:var(--max);
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  gap:28px;
}

.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
  color:var(--text);
  text-decoration:none;
  font-weight:900;
  letter-spacing:.5px;
  margin-right:auto;
}

.brandmark{
  width:36px;
  height:36px;
  flex:0 0 36px;
  display:grid;
  place-items:center;
  font-size:24px;
  font-weight:1000;
  background:linear-gradient(
    135deg,
    var(--lime),
    #ff4cae
  );
  color:#07100b;
  clip-path:polygon(
    24% 0,
    78% 0,
    100% 50%,
    78% 100%,
    24% 100%,
    0 50%
  );
}

.brand-name{
  min-width:0;
  white-space:nowrap;
}

.brand-name strong{
  display:block;
  font-size:16px;
  line-height:1.05;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:8px;
  letter-spacing:2px;
  margin-top:3px;
}

.navlinks{
  display:flex;
  gap:4px;
  align-items:center;
}

.navlinks a{
  color:#aab3c2;
  text-decoration:none;
  padding:10px 12px;
  border-radius:10px;
  font-size:14px;
  white-space:nowrap;
}

.navlinks a:hover,
.navlinks a.active{
  color:#fff;
  background:#121720;
}

.nav-actions{
  display:flex;
  gap:9px;
  align-items:center;
  flex-shrink:0;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #334050;
  background:var(--lime);
  color:#07100b;
  display:grid;
  place-items:center;
  font-weight:900;
  padding:0;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid var(--line);
  background:#10151d;
  color:#fff;
  border-radius:11px;
  padding:12px 17px;
  font-weight:750;
  transition:
    transform .18s,
    border-color .18s,
    background .18s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#536174;
}

.btn.primary{
  background:var(--lime);
  color:#07100b;
  border-color:var(--lime);
}

.btn.ghost{
  background:transparent;
}

.btn.danger{
  border-color:#6e2c3b;
  color:#ff9bab;
}

/* =========================
   PAGE
========================= */

.page{
  width:100%;
  max-width:var(--max);
  margin:auto;
  padding:56px 24px 100px;
}

.shell{
  max-width:var(--max);
  margin:auto;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:610px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:40px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  gap:8px;
  align-items:center;
  border:1px solid rgba(255,45,160,.4);
  color:#ff9bd2;
  background:rgba(255,45,160,.07);
  border-radius:999px;
  padding:9px 13px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.8px;
}

.dot{
  width:7px;
  height:7px;
  background:var(--pink);
  border-radius:50%;
  box-shadow:0 0 16px var(--pink);
}

h1{
  font-size:clamp(54px,7vw,94px);
  line-height:.94;
  letter-spacing:-5px;
  margin:28px 0;
  max-width:100%;
  overflow-wrap:anywhere;
}

.accent{
  color:var(--lime);
}

.lead{
  max-width:700px;
  color:#aab4c3;
  font-size:18px;
  line-height:1.65;
}

.hero-actions{
  display:flex;
  gap:12px;
  margin-top:28px;
  flex-wrap:wrap;
}

/* =========================
   ORBIT
========================= */

.orbit{
  min-height:470px;
  position:relative;
  display:grid;
  place-items:center;
}

.ring{
  position:absolute;
  border:1px solid rgba(183,255,0,.25);
  border-radius:50%;
  width:440px;
  height:440px;
}

.ring.r2{
  width:340px;
  height:340px;
  border-color:rgba(32,217,255,.28);
}

.ring.r3{
  width:230px;
  height:230px;
  border-color:rgba(255,45,160,.35);
}

.core{
  width:210px;
  height:240px;
  background:
    linear-gradient(
      150deg,
      #121923,
      #090d13
    );
  border:1px solid #2b3542;
  border-radius:26px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.core .v{
  font-size:94px;
  font-weight:1000;
  background:
    linear-gradient(
      135deg,
      #f94e9e,
      var(--lime)
    );
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text;
}

.core span{
  font-size:10px;
  color:#778295;
  letter-spacing:1.5px;
}

.float{
  position:absolute;
  background:#111720;
  border:1px solid #303a49;
  border-radius:14px;
  padding:14px 17px;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  font-size:13px;
}

.float b{
  display:block;
  margin-bottom:3px;
}

.f1{
  top:8%;
  left:4%;
}

.f2{
  top:22%;
  right:-2%;
}

.f3{
  bottom:14%;
  right:3%;
}

/* =========================
   SECTIONS
========================= */

.section{
  padding:65px 0;
}

.section-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:end;
  margin-bottom:24px;
}

.kicker{
  font-size:11px;
  color:#7e899b;
  letter-spacing:2px;
  font-weight:900;
}

.section h2{
  font-size:46px;
  letter-spacing:-2px;
  margin:8px 0 0;
}

/* =========================
   GRID
========================= */

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.feature{
  padding:25px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(17,23,33,.92),
      rgba(10,13,18,.92)
    );
  min-height:180px;
}

.feature h3{
  margin:12px 0 7px;
}

.feature p{
  color:var(--muted);
  line-height:1.55;
}

.icon{
  font-size:26px;
  color:var(--lime);
}

/* =========================
   PAGE TITLE
========================= */

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:25px;
}

.page-title > div{
  min-width:0;
}

.page-title h1{
  font-size:58px;
  letter-spacing:-3px;
  margin:10px 0 0;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:grid;
  grid-template-columns:1.4fr .6fr;
  gap:12px;
  margin-bottom:22px;
}

.input,
.textarea,
.select{
  width:100%;
  background:#090e15;
  color:#fff;
  border:1px solid #293342;
  border-radius:11px;
  padding:13px 14px;
  outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:#65748a;
  box-shadow:
    0 0 0 3px rgba(183,255,0,.06);
}

.textarea{
  min-height:130px;
  resize:vertical;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.card{
  min-width:0;
  background:
    linear-gradient(
      160deg,
      #0e141c,
      #0a0e14
    );
  border:1px solid #26303d;
  border-radius:17px;
  padding:20px;
  overflow:hidden;
}

.card h3{
  margin:8px 0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.card p{
  color:#9ca7b6;
  line-height:1.55;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.meta{
  max-width:100%;
  font-size:12px;
  color:#748095;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:14px 0;
}

.tag{
  font-size:11px;
  border:1px solid #2e3948;
  border-radius:999px;
  padding:5px 8px;
  color:#aeb8c7;
  max-width:100%;
  overflow-wrap:anywhere;
}

.empty{
  border:1px dashed #2c3643;
  border-radius:16px;
  padding:50px;
  text-align:center;
  color:#778397;
  grid-column:1/-1;
}

.card-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(10px);
  z-index:50;
  display:grid;
  place-items:center;
  padding:20px;
}

.modal{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:#0c1118;
  border:1px solid #2c3745;
  border-radius:20px;
  padding:28px;
  box-shadow:0 40px 100px #000;
}

.modal.large{
  width:min(900px,100%);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:20px;
}

.close{
  border:0;
  background:transparent;
  color:#8f9aaa;
  font-size:25px;
}

.modal h2{
  font-size:36px;
  letter-spacing:-1px;
  margin:8px 0;
}

.auth-copy{
  color:#8f9aaa;
  line-height:1.5;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  min-width:0;
}

.field label{
  display:block;
  font-size:12px;
  color:#9aa5b5;
  margin:0 0 7px;
  font-weight:700;
}

.field.full{
  grid-column:1/-1;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}

.tabs{
  display:flex;
  gap:8px;
  margin:18px 0;
}

.tab{
  flex:1;
  padding:12px;
  border:1px solid #2a3441;
  border-radius:10px;
  background:#0b1017;
  color:#9aa5b5;
}

.tab.active{
  background:var(--lime);
  border-color:var(--lime);
  color:#07100b;
  font-weight:900;
}

/* =========================
   PROFILE
========================= */

.profile{
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:22px;
}

.profile-card{
  min-width:0;
  background:#0e141c;
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px;
  overflow:hidden;
}

.profile-big{
  width:90px;
  height:90px;
  border-radius:50%;
  background:var(--lime);
  color:#07100b;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:16px;
}

.profile-name{
  font-size:30px;
  line-height:1.08;
  letter-spacing:-1px;
  margin:0 0 8px;
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
  white-space:normal;
}

.profile-card h2{
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.profile-card p{
  overflow-wrap:anywhere;
  word-break:break-word;
}

/* =========================
   STATS
========================= */

.statgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  min-width:0;
  border:1px solid var(--line);
  background:#0e141c;
  padding:18px;
  border-radius:15px;
  overflow:hidden;
}

.stat strong{
  font-size:27px;
}

/* =========================
   SPLIT
========================= */

.split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

/* =========================
   CHAT
========================= */

.chat{
  display:grid;
  grid-template-columns:280px minmax(0,1fr);
  height:620px;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:#0a0f15;
}

.chat-side{
  border-right:1px solid var(--line);
  padding:16px;
  overflow:auto;
}

.person{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  overflow:hidden;
}

.person:hover,
.person.active{
  background:#151c26;
}

.person b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  padding:22px;
  overflow:auto;
}

.bubble{
  max-width:72%;
  padding:11px 14px;
  border-radius:14px;
  margin-bottom:10px;
  background:#151d27;
  color:#dce2ea;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.bubble.mine{
  margin-left:auto;
  background:var(--lime);
  color:#07100b;
}

.composer{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line);
}

.composer .input{
  flex:1;
}

/* =========================
   NOTICES
========================= */

.notice{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:80;
  background:#131a23;
  border:1px solid #364252;
  padding:13px 16px;
  border-radius:12px;
  box-shadow:0 20px 50px #000;
  max-width:360px;
}

.notice.ok{
  border-color:#719c1a;
}

.notice.err{
  border-color:#8c3344;
}

.hidden{
  display:none!important;
}

.filebox{
  border:1px dashed #394555;
  border-radius:12px;
  padding:15px;
}

.small{
  font-size:12px;
  color:#748095;
}

.link{
  color:var(--lime);
  text-decoration:none;
  overflow-wrap:anywhere;
}

.answer{
  border-top:1px solid #242e3a;
  padding-top:14px;
  margin-top:14px;
}

.role{
  color:#a6b0bf;
}

.application{
  padding:14px;
  border:1px solid #283340;
  border-radius:12px;
  margin-bottom:10px;
}

/* =========================
   ASSIGNMENTS
========================= */

.assignment-card{
  min-width:0;
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(17,23,33,.96),
      rgba(8,11,16,.96)
    );
  border-radius:18px;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}

.status{
  display:inline-flex;
  width:max-content;
  max-width:100%;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  overflow-wrap:anywhere;
}

.status.open{
  border-color:rgba(183,255,0,.35);
  color:var(--lime);
}

.status.accepted,
.status.advance_paid,
.status.rework{
  border-color:rgba(32,217,255,.35);
  color:var(--cyan);
}

.status.submitted,
.status.approved_payment_due{
  border-color:rgba(255,45,160,.35);
  color:#ff8bc9;
}

.status.completed{
  border-color:rgba(183,255,0,.5);
  color:var(--lime);
}

.money{
  font-size:22px;
  font-weight:900;
  white-space:nowrap;
}

.workflow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:18px 0;
}

.step{
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
}

.step.on{
  border-color:var(--lime);
  color:var(--text);
  background:rgba(183,255,0,.06);
}

.assignment-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:auto;
}

.noticebox{
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.02);
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.paybox{
  border:1px solid rgba(183,255,0,.28);
  background:rgba(183,255,0,.05);
  padding:16px;
  border-radius:14px;
}

.mutedline{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   FOOTER
========================= */

.footer{
  border-top:1px solid var(--line);
  padding:28px 24px;
  color:#657082;
  text-align:center;
  font-size:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

  .nav{
    gap:14px;
  }

  .navlinks a{
    padding:9px 8px;
    font-size:13px;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .grid3{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:900px){

  .hero{
    grid-template-columns:1fr;
  }

  .orbit{
    display:none;
  }

  .navlinks{
    display:none;
  }

  .profile{
    grid-template-columns:1fr;
  }

  .chat{
    grid-template-columns:1fr;
  }

  .chat-side{
    display:none;
  }

  .statgrid{
    grid-template-columns:1fr 1fr;
  }

  .workflow{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:700px){

  .page{
    padding:35px 15px 80px;
  }

  .nav{
    padding:0 15px;
  }

  .nav-actions .btn{
    display:none;
  }

  .brand-name strong{
    font-size:14px;
  }

  h1{
    letter-spacing:-3px;
  }

  .page-title{
    display:block;
  }

  .page-title .btn{
    margin-top:18px;
  }

  .page-title h1{
    font-size:44px;
  }

  .cards,
  .grid3,
  .split,
  .formgrid,
  .toolbar{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .modal{
    padding:20px;
  }

  .section h2{
    font-size:37px;
  }

  .statgrid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:480px){

  .brand small{
    font-size:7px;
    letter-spacing:1.5px;
  }

  .brandmark{
    width:32px;
    height:32px;
    flex-basis:32px;
    font-size:21px;
  }

  .avatar{
    width:38px;
    height:38px;
  }

  .page-title h1{
    font-size:38px;
    letter-spacing:-2px;
  }

  .hero{
    min-height:auto;
  }

  .hero-actions{
    flex-direction:column;
  }

  .hero-actions .btn{
    width:100%;
  }

  .cards{
    grid-template-columns:1fr;
  }

/* =========================================================
   HELPERS
========================================================= */

const $ = selector =>
  document.querySelector(selector);

const esc = value =>
  String(value ?? "").replace(
    /[&<>'"]/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[char])
  );

function initials(name){

  return String(name || "V")
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();

}

function toast(message, ok = true){

  const element = document.createElement("div");

  element.className =
    "notice " +
    (ok ? "ok" : "err");

  element.textContent = message;

  const container = $("#toast");

  if(container){
    container.appendChild(element);

    setTimeout(() => {
      element.remove();
    },3500);
  }

}


/* =========================================================
   API
========================================================= */

const api = async (path, opt = {}) => {

  // Always get the newest token.
  // This prevents Render/page navigation from using
  // an empty or stale state.token.
  const token =
    state.token ||
    localStorage.getItem("vn_token") ||
    "";

  const headers = {
    ...(opt.headers || {})
  };

  // Add authentication automatically
  if (token) {
    headers.Authorization = `Bearer ${token}`;
  }

  const response = await fetch(
    "/api" + path,
    {
      ...opt,
      headers,
      credentials: "same-origin"
    }
  );

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  // If server says login is required,
  // clear the invalid local session.
  if (response.status === 401) {

    state.token = "";
    state.user = null;

    localStorage.removeItem("vn_token");

    throw new Error(
      data.error || "Login required."
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );
  }

  return data;
};

  state.route =

  if(!routes[state.route]){
    state.route = "home";
  }

  const app = $("#app");

  app.innerHTML =
    nav() +
    routes[state.route]();

  window.scrollTo(0,0);

  afterRender();

}

async function afterRender(){

  try{

    if(state.route === "marketplace"){
      await loadProjects();

    if(state.route === "assignments"){
      await loadAssignments();
    }

    if(state.route === "doubts"){
      await loadDoubts();
    }

    if(state.route === "opportunities"){
      await loadOpportunities();
    }

    if(state.route === "network"){
      await loadUsers();
    }

    if(state.route === "dashboard"){
      await loadDashboard();
    }

    if(state.route === "messages"){
      await loadConnections();
    }

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}

/* =========================================================
   FILE TO BASE64
========================================================= */

async function fileJson(input){

  const file =
    input?.files?.[0];

  if(!file){
    return null;
  }

  return await new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload = () =>
        resolve({
          name:file.name,
          data:reader.result
        });

      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}

/* =========================================================
   LOGIN
========================================================= */

function userFromToken(token){
  try{
    const parts = String(token || "").split(".");
    if(parts.length !== 3) return null;

    const base64 = parts[1]
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    const json = decodeURIComponent(
      atob(base64)
        .split("")
        .map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
        .join("")
    );

    const payload = JSON.parse(json);
    const meta = payload.user_metadata || {};

    return {
      id: payload.sub || meta.sub || "",
      email: payload.email || meta.email || "",
      fullName: meta.fullName || meta.full_name || "",
      programme: meta.programme || "",
      role: meta.role || "",
      rollNumber: meta.rollNumber || meta.roll_number || "",
      status: meta.status || "Student",
      graduationYear: meta.graduationYear || meta.graduation_year || "",
      joinAs: meta.joinAs || meta.join_as || "Student",
      phone: meta.phone || "",
      bio: meta.bio || "",
      profilePicture: meta.profilePicture || meta.profile_picture || ""
    };
  }catch(e){
    console.warn("Could not read user from login token", e);
    return null;
  }
}

async function submitLogin(event){

  event.preventDefault();

  try{

    const result =
      await api(
        "/auth/login",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            email:
              $("#loginEmail").value,

            password:
              $("#loginPassword").value
          })
        }
      );

    if(!result.token){
      throw new Error(
        result.error || "Login failed. No authentication token was returned."
      );
    }

    // IMPORTANT FOR RENDER:
    // The API can return a valid token while result.user is null.
    // Store the token first, then recover the basic profile from
    // the Supabase JWT so the frontend can enter the logged-in state.
    state.token = result.token;

    state.user =
      result.user ||
      userFromToken(result.token) ||
      {
        email: $("#loginEmail").value,
        fullName: $("#loginEmail").value.split("@")[0],
        status: "Student"
      };

    localStorage.setItem(
      "vn_token",
      state.token
    );

    closeModal();

    toast(
      "Welcome back."
    );

        render();

    go("dashboard");

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}

async function submitAssignmentPost(event){

  event.preventDefault();

  try{

    const form =
      new FormData(event.target);

    const data =
      Object.fromEntries(
        form.entries()
      );

    data.budget =
      Number(data.budget);

    data.advancePercent =
      Number(data.advancePercent);

    data.reworksAllowed =
      Number(data.reworksAllowed);

    data.assignmentFile =
      await fileJson(
        event.target.assignmentFile
      );

    await api(
      "/assignments",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify(data)
      }
    );

    closeModal();

    toast(
      "Assignment published — members can now accept it."
    );

    await loadAssignments();

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}


async function loadAssignments(){

  const data =

}


function filterAssignments(query){

  const text =
    String(query || "")
      .toLowerCase();

  drawAssignments(
    state.assignments.filter(
      assignment =>
        [
          assignment.title,
          assignment.description,
          assignment.category,
          assignment.skills,
          assignment.poster?.fullName,
          assignment.worker?.fullName,
          assignment.status
        ]
        .join(" ")
        .toLowerCase()
        .includes(text)
    )
  );

}


function workflow(assignment){

  const order = [
    "open",
    "accepted",
    "advance_paid",
    "submitted",
    "approved_payment_due",
    "completed"
  ];

  let stage =
    order.indexOf(
      assignment.status
    );

  if(
    assignment.status === "rework"
  ){
    stage = 3;
  }

  const labels = [
    "Posted",
    "Accepted",
    "Advance paid",
    "Submitted / rework",
    "Approved + final paid"
  ];

  return `

    <div class="workflow">

      ${
        labels.map(
          (label,index) => `
            <div
              class="step ${
                stage >= index
                ? "on"
                : ""
              }"
            >
              ${index + 1}.
              ${label}
            </div>
          `
        ).join("")
      }

    </div>

  `;

}


function assignmentActions(assignment){

  if(!state.user){

    return `
      <button
        class="btn primary"
        onclick="openAuth('login')"
      >
        Log in to accept
      </button>
    `;

  }

  const mine =
    assignment.poster?.id ===
    state.user.id;

  const worker =
    assignment.worker?.id ===
    state.user.id;

  let html = "";


  if(
    assignment.status === "open" &&
    !mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="acceptAssignment('${assignment.id}')"
      >
        Accept assignment
      </button>
    `;

  }


  if(
    assignment.status === "accepted" &&
    mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="payAdvance('${assignment.id}')"
      >
        Pay advance ₹${
          Math.round(
            assignment.budget *
            assignment.advancePercent /
            100
          ).toLocaleString("en-IN")
        }
      </button>
    `;

  }


  if(
    [
      "advance_paid",
      "rework"
    ].includes(
      assignment.status
    ) &&
    worker
  ){

    html += `
      <button
        class="btn primary"
        onclick="submitAssignment('${assignment.id}')"
      >
        Submit work
      </button>
    `;

  }


  if(
    assignment.status === "submitted" &&
    mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="approveAssignment('${assignment.id}')"
      >
        Approve & release final
      </button>
    `;


    if(
      assignment.reworksUsed <
      assignment.reworksAllowed
    ){

      html += `
        <button
          class="btn"
          onclick="requestRework('${assignment.id}')"
        >
          Request rework
          (
          ${
            assignment.reworksAllowed -
            assignment.reworksUsed
          }
          left)
        </button>
      `;

    }

  }


  if(
    assignment.status ===
    "approved_payment_due" &&
    mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="payFinal('${assignment.id}')"
      >
        Pay remaining ₹${
          (
            assignment.budget -
            (
              assignment.advanceAmount ||
              Math.round(
                assignment.budget *
                assignment.advancePercent /
                100
              )
            )
          ).toLocaleString("en-IN")
        }
      </button>
    `;

  }


  if(assignment.assignmentFile){

    html += `
      <a
        class="btn"
        href="${assignment.assignmentFile.url}"
        target="_blank"
        rel="noopener"
      >
        Open brief ↗
      </a>
    `;

  }


  if(assignment.deliveryFile){

    html += `
      <a
        class="btn"
        href="${assignment.deliveryFile.url}"
        target="_blank"
        rel="noopener"
      >
        Open delivery ↗
      </a>
    `;

  }


  if(!html){

    return `
      <span class="mutedline">

        ${
          mine
          ? "Waiting for someone to accept this assignment."
          : worker
          ? "Waiting for the poster."
          : "This assignment is in progress."
        }

      </span>
    `;

  }

  return html;

}

    $("#programmeFilter")?.value ||

  drawUsers(
    state.users.filter(

          programme === "all" ||
          user.programme ===

        Connect with someone in Network first.

      </div>
    `;

}


async function selectChat(id){

  state.selectedChat =
    id;

  await loadConnections();

  const user =
    state.connections.find(
      x => x.id === id
    );

  $("#chatTitle").textContent =
    user
    ? user.fullName
    : "Conversation";

  const data =
    await api(
      "/messages?userId=" +
      encodeURIComponent(id)
    );

  $("#messages").innerHTML =
    data.messages.length

    ?

    data.messages.map(
      message => `

        <div
          class="
            bubble
            ${
              message.from ===
              state.user.id
              ? "mine"
              : ""
            }
          "
        >

          ${esc(
            message.text
          )}

          <div
            style="
              font-size:9px;
              opacity:.55;
              margin-top:5px;
            "
          >
            ${
              new Date(
                message.createdAt
              ).toLocaleString()
            }
          </div>

        </div>

      `
    ).join("")

    :

    `
      <div class="empty">
        No messages yet.
        Say hello.
      </div>
    `;

  $("#messages").scrollTop =
    $("#messages").scrollHeight;

}


async function sendMessage(){

  if(!state.selectedChat){

    return toast(
      "Select a connection first.",
      false
    );

  }

  const input =
    $("#messageInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  try{

    await api(
      "/messages",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          to:
            state.selectedChat,

          text
        })
      }
    );

    input.value = "";

    await selectChat(
      state.selectedChat
    );

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}
