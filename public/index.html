<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VENZNOVA — NIFT/CONNECT</title>
<meta name="description" content="NIFT student creative economy network for projects, doubts, opportunities and connections.">
<style>
:root{--bg:#07090d;--panel:#0d1118;--panel2:#111721;--line:#27303d;--text:#f6f7fb;--muted:#8d98a9;--lime:#b7ff00;--pink:#ff2da0;--cyan:#20d9ff;--danger:#ff6178;--max:1240px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 8% 15%,rgba(255,45,160,.11),transparent 28%),radial-gradient(circle at 90% 55%,rgba(183,255,0,.10),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:76px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(7,9,13,.86);backdrop-filter:blur(18px)}.nav{height:100%;max-width:var(--max);margin:auto;padding:0 24px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:11px;color:var(--text);text-decoration:none;font-weight:900;letter-spacing:.5px;margin-right:auto}.brandmark{width:34px;height:34px;display:grid;place-items:center;font-size:24px;font-weight:1000;background:linear-gradient(135deg,var(--lime),#ff4cae);color:#07100b;clip-path:polygon(24% 0,78% 0,100% 50%,78% 100%,24% 100%,0 50%)}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:2px;margin-top:2px}.navlinks{display:flex;gap:4px}.navlinks a{color:#aab3c2;text-decoration:none;padding:10px 12px;border-radius:10px;font-size:14px}.navlinks a:hover,.navlinks a.active{color:#fff;background:#121720}.nav-actions{display:flex;gap:9px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;border:1px solid #334050;background:var(--lime);color:#07100b;display:grid;place-items:center;font-weight:900}.btn{border:1px solid var(--line);background:#10151d;color:#fff;border-radius:11px;padding:12px 17px;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px);border-color:#536174}.btn.primary{background:var(--lime);color:#07100b;border-color:var(--lime)}.btn.ghost{background:transparent}.btn.danger{border-color:#6e2c3b;color:#ff9bab}.page{max-width:var(--max);margin:auto;padding:56px 24px 100px}.hero{min-height:610px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}.eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,45,160,.4);color:#ff9bd2;background:rgba(255,45,160,.07);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;letter-spacing:.8px}.dot{width:7px;height:7px;background:var(--pink);border-radius:50%;box-shadow:0 0 16px var(--pink)}h1{font-size:clamp(54px,7vw,94px);line-height:.94;letter-spacing:-5px;margin:28px 0}.accent{color:var(--lime)}.lead{max-width:700px;color:#aab4c3;font-size:18px;line-height:1.65}.hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.orbit{min-height:470px;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(183,255,0,.25);border-radius:50%;width:440px;height:440px}.ring.r2{width:340px;height:340px;border-color:rgba(32,217,255,.28)}.ring.r3{width:230px;height:230px;border-color:rgba(255,45,160,.35)}.core{width:210px;height:240px;background:linear-gradient(150deg,#121923,#090d13);border:1px solid #2b3542;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.55)}.core .v{font-size:94px;font-weight:1000;background:linear-gradient(135deg,#f94e9e,var(--lime));color:transparent;background-clip:text}.core span{font-size:10px;color:#778295;letter-spacing:1.5px}.float{position:absolute;background:#111720;border:1px solid #303a49;border-radius:14px;padding:14px 17px;box-shadow:0 16px 40px rgba(0,0,0,.35);font-size:13px}.float b{display:block;margin-bottom:3px}.f1{top:8%;left:4%}.f2{top:22%;right:-2%}.f3{bottom:14%;right:3%}.section{padding:65px 0}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.kicker{font-size:11px;color:#7e899b;letter-spacing:2px;font-weight:900}.section h2{font-size:46px;letter-spacing:-2px;margin:8px 0 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{padding:25px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(17,23,33,.92),rgba(10,13,18,.92));min-height:180px}.feature h3{margin:12px 0 7px}.feature p{color:var(--muted);line-height:1.55}.icon{font-size:26px;color:var(--lime)}.footer{border-top:1px solid var(--line);padding:28px 24px;color:#657082;text-align:center;font-size:12px}.shell{max-width:var(--max);margin:auto}.page-title{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.page-title h1{font-size:58px;letter-spacing:-3px;margin:10px 0 0}.toolbar{display:grid;grid-template-columns:1.4fr .6fr;gap:12px;margin-bottom:22px}.input,.textarea,.select{width:100%;background:#090e15;color:#fff;border:1px solid #293342;border-radius:11px;padding:13px 14px;outline:none}.input:focus,.textarea:focus,.select:focus{border-color:#65748a;box-shadow:0 0 0 3px rgba(183,255,0,.06)}.textarea{min-height:130px;resize:vertical}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(160deg,#0e141c,#0a0e14);border:1px solid #26303d;border-radius:17px;padding:20px}.card h3{margin:8px 0}.card p{color:#9ca7b6;line-height:1.55}.meta{font-size:12px;color:#748095}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tag{font-size:11px;border:1px solid #2e3948;border-radius:999px;padding:5px 8px;color:#aeb8c7}.empty{border:1px dashed #2c3643;border-radius:16px;padding:50px;text-align:center;color:#778397;grid-column:1/-1}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(10px);z-index:50;display:grid;place-items:center;padding:20px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0c1118;border:1px solid #2c3745;border-radius:20px;padding:28px;box-shadow:0 40px 100px #000}.modal.large{width:min(900px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.close{border:0;background:transparent;color:#8f9aaa;font-size:25px}.modal h2{font-size:36px;letter-spacing:-1px;margin:8px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;color:#9aa5b5;margin:0 0 7px;font-weight:700}.field.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;padding:12px;border:1px solid #2a3441;border-radius:10px;background:#0b1017;color:#9aa5b5}.tab.active{background:var(--lime);border-color:var(--lime);color:#07100b;font-weight:900}.auth-copy{color:#8f9aaa;line-height:1.5}.profile{display:grid;grid-template-columns:250px 1fr;gap:22px}.profile-card{background:#0e141c;border:1px solid var(--line);border-radius:18px;padding:25px}.profile-big{width:90px;height:90px;border-radius:50%;background:var(--lime);color:#07100b;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:16px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);background:#0e141c;padding:18px;border-radius:15px}.stat strong{font-size:27px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chat{display:grid;grid-template-columns:280px 1fr;height:620px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0a0f15}.chat-side{border-right:1px solid var(--line);padding:16px}.person{padding:12px;border-radius:10px;cursor:pointer}.person:hover,.person.active{background:#151c26}.chat-main{display:flex;flex-direction:column}.messages{flex:1;padding:22px;overflow:auto}.bubble{max-width:72%;padding:11px 14px;border-radius:14px;margin-bottom:10px;background:#151d27;color:#dce2ea}.bubble.mine{margin-left:auto;background:var(--lime);color:#07100b}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer .input{flex:1}.notice{position:fixed;right:20px;bottom:20px;z-index:80;background:#131a23;border:1px solid #364252;padding:13px 16px;border-radius:12px;box-shadow:0 20px 50px #000;max-width:360px}.notice.ok{border-color:#719c1a}.notice.err{border-color:#8c3344}.hidden{display:none!important}.filebox{border:1px dashed #394555;border-radius:12px;padding:15px}.small{font-size:12px;color:#748095}.link{color:var(--lime);text-decoration:none}.answer{border-top:1px solid #242e3a;padding-top:14px;margin-top:14px}.role{color:#a6b0bf}.application{padding:14px;border:1px solid #283340;border-radius:12px;margin-bottom:10px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.orbit{display:none}.grid3,.cards{grid-template-columns:1fr 1fr}.navlinks{display:none}.profile{grid-template-columns:1fr}.chat{grid-template-columns:1fr}.chat-side{display:none}.statgrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.page{padding:35px 15px 80px}.nav{padding:0 15px}.nav-actions .btn{display:none}h1{letter-spacing:-3px}.grid3,.cards,.split,.formgrid,.toolbar{grid-template-columns:1fr}.page-title{display:block}.page-title h1{font-size:44px}.field.full{grid-column:auto}.modal{padding:20px}.section h2{font-size:37px}}

.assignment-card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(17,23,33,.96),rgba(8,11,16,.96));border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}.status{display:inline-flex;width:max-content;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.status.open{border-color:rgba(183,255,0,.35);color:var(--lime)}.status.accepted,.status.advance_paid,.status.rework{border-color:rgba(32,217,255,.35);color:var(--cyan)}.status.submitted,.status.approved_payment_due{border-color:rgba(255,45,160,.35);color:#ff8bc9}.status.completed{border-color:rgba(183,255,0,.5);color:var(--lime)}.money{font-size:22px;font-weight:900}.workflow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.step{padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:11px;color:var(--muted)}.step.on{border-color:var(--lime);color:var(--text);background:rgba(183,255,0,.06)}.assignment-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.noticebox{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);font-size:13px;line-height:1.5}.paybox{border:1px solid rgba(183,255,0,.28);background:rgba(183,255,0,.05);padding:16px;border-radius:14px}.mutedline{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const state={token:localStorage.getItem('vn_token')||'',user:null,route:'home',projects:[],doubts:[],opportunities:[],assignments:[],users:[],connections:[],selectedChat:null};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const api=async(path,opt={})=>{const h=opt.headers||{};if(state.token)h.Authorization='Bearer '+state.token;const r=await fetch('/api'+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d};
function toast(msg,ok=true){const e=document.createElement('div');e.className='notice '+(ok?'ok':'err');e.textContent=msg;$('#toast').appendChild(e);setTimeout(()=>e.remove(),3500)}
function initials(name){return String(name||'V').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function nav(){return `<header class="topbar"><nav class="nav"><a class="brand" href="#/"><span class="brandmark">V</span><span>VENZNOVA<small>NIFT / CONNECT</small></span></a><div class="navlinks">${[['marketplace','Marketplace'],['assignments','Assignments'],['doubts','Doubt Desk'],['opportunities','Opportunities'],['network','Network'],['dashboard','Dashboard']].map(x=>`<a class="${state.route===x[0]?'active':''}" href="#/${x[0]}">${x[1]}</a>`).join('')}</div><div class="nav-actions">${state.user?`<button class="btn ghost" onclick="go('messages')">Messages</button><button class="avatar" onclick="go('dashboard')">${initials(state.user.fullName)}</button>`:`<button class="btn" onclick="openAuth('login')">Log in</button><button class="btn primary" onclick="openAuth('signup')">Join network ↗</button>`}</div></nav></header>`}
function home(){return `<main><div class="page"><section class="hero"><div><span class="eyebrow"><span class="dot"></span>NIFT'S CREATIVE ECONOMY, CONNECTED</span><h1>Make work.<br><span class="accent">Find people.</span><br>Move forward.</h1><p class="lead">A real student network for NIFT juniors, seniors, alumni and collaborators to publish projects, solve doubts, discover opportunities and build meaningful professional connections.</p><div class="hero-actions"><button class="btn primary" onclick="${state.user?"go('marketplace')":"openAuth('signup')"}">${state.user?'Explore marketplace →':'Enter VENZNOVA →'}</button><button class="btn ghost" onclick="go('network')">Meet the network ↓</button></div></div><div class="orbit"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"><div class="v">V</div><span>CREATE → CONNECT → GROW</span></div><div class="float f1"><b>Ask a senior</b><span class="small">Get assignment help</span></div><div class="float f2"><b>New opportunity</b><span class="small">Fashion internship</span></div><div class="float f3"><b>Student project</b><span class="small">Publish & get seen</span></div></div></section><section class="section"><div class="section-head"><div><div class="kicker">ONE PLATFORM</div><h2>Everything has a place.</h2></div></div><div class="grid3"><div class="feature"><div class="icon">✦</div><h3>Marketplace</h3><p>Students publish real projects, portfolios and work. Others can discover, like and connect with the creator.</p></div><div class="feature"><div class="icon">?</div><h3>Doubt Desk</h3><p>Ask academic, technical, design or career questions and receive answers from people in the network.</p></div><div class="feature"><div class="icon">↗</div><h3>Opportunities</h3><p>Share internships, jobs, freelance work and project calls. Students can apply directly.</p></div></div></section><section class="section"><div class="section-head"><div><div class="kicker">BUILT FOR NIFT</div><h2>From classroom to career.</h2></div><button class="btn" onclick="go('network')">Find people →</button></div><div class="grid3"><div class="feature"><h3>BFTech</h3><p>Dedicated programme support with roll number, graduation year, skills and professional profile.</p></div><div class="feature"><h3>Public projects</h3><p>Upload PDF, images, presentations, documents or ZIP files and make selected work visible to the network.</p></div><div class="feature"><h3>Direct messages</h3><p>Connect with another member and start a private conversation from their profile or project.</p></div></div></section></div></main>`}
function searchBar(placeholder,action,select=''){return `<div class="toolbar"><input id="search" class="input" placeholder="${placeholder}" oninput="${action}(this.value)">${select}</div>`}
function marketplace(){return `<main class="page"><div class="page-title"><div><div class="kicker">MARKETPLACE</div><h1>Student work.</h1></div>${state.user?`<button class="btn primary" onclick="openProject()">+ Upload project</button>`:`<button class="btn primary" onclick="openAuth('signup')">Join to upload</button>`}</div>${searchBar('Search projects, skills, creators...','filterProjects')}<div id="projectGrid" class="cards"><div class="empty">Loading projects...</div></div></main>`}
function assignments(){return `<main class="page"><div class="page-title"><div><div class="kicker">ASSIGNMENT MARKET</div><h1>Post. Accept. Deliver. Get paid.</h1><p class="lead" style="max-width:760px">Students, alumni and clients can post paid assignments. Any eligible member can accept an open assignment, receive the agreed advance, submit work, and complete up to 3 agreed rework rounds before final payment.</p></div>${state.user?`<button class="btn primary" onclick="openAssignment()">+ Post assignment</button>`:`<button class="btn primary" onclick="openAuth('signup')">Join to work</button>`}</div>${searchBar('Search assignments, skills, category, poster...','filterAssignments')}<div class="noticebox" style="margin-bottom:22px"><b>How it works:</b> 1) Poster creates the brief and budget → 2) A member accepts → 3) Poster pays the advance → 4) Worker submits → 5) Poster approves or requests up to 3 reworks → 6) Poster pays the remaining amount and the assignment closes.</div><div id="assignmentGrid" class="cards"><div class="empty">Loading assignments...</div></div></main>`}
function doubts(){return `<main class="page"><div class="page-title"><div><div class="kicker">DOUBT DESK</div><h1>Ask. Learn. Answer.</h1></div>${state.user?`<button class="btn primary" onclick="openDoubt()">+ Ask a doubt</button>`:`<button class="btn primary" onclick="openAuth('signup')">Join to ask</button>`}</div>${searchBar('Search doubts, topics, questions...','filterDoubts')}<div id="doubtGrid" class="cards"><div class="empty">Loading doubts...</div></div></main>`}
function opportunities(){return `<main class="page"><div class="page-title"><div><div class="kicker">OPPORTUNITIES</div><h1>Work is out there.</h1></div>${state.user?`<button class="btn primary" onclick="openOpportunity()">+ Post opportunity</button>`:`<button class="btn primary" onclick="openAuth('signup')">Join network</button>`}</div>${searchBar('Search internships, jobs, freelance, projects...','filterOpportunities')}<div id="oppGrid" class="cards"><div class="empty">Loading opportunities...</div></div></main>`}
function network(){return `<main class="page"><div class="page-title"><div><div class="kicker">THE NETWORK</div><h1>Find your people.</h1></div><button class="btn" onclick="loadUsers()">Refresh network</button></div>${searchBar('Search name, roll number, programme, skill...','filterUsers',`<select id="programmeFilter" class="select" onchange="filterUsers($('#search')?.value||'')"><option value="all">All programmes</option><option value="BFTech">BFTech</option><option value="B.Des">B.Des</option><option value="MFM">MFM</option><option value="M.Des">M.Des</option></select>`)}<div id="userGrid" class="cards"><div class="empty">Loading network...</div></div></main>`}
function dashboard(){return `<main class="page"><div class="page-title"><div><div class="kicker">PERSONAL CONTROL CENTRE</div><h1>Your dashboard.</h1></div><button class="btn danger" onclick="logout()">Log out</button></div><div id="dashboardContent"><div class="empty">Loading...</div></div></main>`}
function messages(){return `<main class="page"><div class="page-title"><div><div class="kicker">DIRECT</div><h1>Messages.</h1></div><button class="btn" onclick="loadConnections()">Refresh</button></div><div class="chat"><aside class="chat-side"><div id="people"><div class="empty">Loading...</div></div></aside><section class="chat-main"><div id="chatTitle" style="padding:20px;border-bottom:1px solid var(--line);font-weight:800">Select a connection</div><div id="messages" class="messages"></div><div class="composer"><input id="messageInput" class="input" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn primary" onclick="sendMessage()">Send</button></div></section></div></main>`}
function render(){const routes={home,marketplace,assignments,doubts,opportunities,network,dashboard,messages};state.route=location.hash.replace('#/','')||'home';if(!routes[state.route])state.route='home';$('#app').innerHTML=nav()+(routes[state.route]());window.scrollTo(0,0);afterRender()}
async function afterRender(){try{if(state.route==='marketplace')await loadProjects();if(state.route==='assignments')await loadAssignments();if(state.route==='doubts')await loadDoubts();if(state.route==='opportunities')await loadOpportunities();if(state.route==='network')await loadUsers();if(state.route==='dashboard')await loadDashboard();if(state.route==='messages')await loadConnections()}catch(e){toast(e.message,false)}}
function go(r){location.hash='#/'+r}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',async()=>{if(state.token){try{state.user=(await api('/me')).user}catch{state.token='';localStorage.removeItem('vn_token')}}render()});
function openModal(html){$('#modal').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
function openAuth(mode='signup'){const signup=mode==='signup';openModal(`<div class="modal-head"><div><div class="kicker">VENZNOVA / IDENTITY</div><h2>${signup?'Create your profile.':'Welcome back.'}</h2><p class="auth-copy">${signup?'Build your academic and professional identity.':'Log in to continue.'}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="tabs"><button class="tab ${signup?'active':''}" onclick="openAuth('signup')">Sign up</button><button class="tab ${!signup?'active':''}" onclick="openAuth('login')">Log in</button></div>${signup?`<form id="signupForm" onsubmit="submitSignup(event)"><div class="formgrid"><div class="field"><label>Full Name *</label><input class="input" name="fullName" required placeholder="Your full name"></div><div class="field"><label>Roll Number *</label><input class="input" name="rollNumber" required placeholder="NIFT roll number"></div><div class="field"><label>Email *</label><input class="input" name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Graduation Year *</label><input class="input" name="graduationYear" type="number" min="2020" max="2050" value="2027" required></div><div class="field"><label>Programme *</label><select class="select" name="programme" required><option value="BFTech">BFTech</option><option>B.Des</option><option>MFM</option><option>M.Des</option></select></div><div class="field"><label>Current Status *</label><select class="select" name="status" required><option>Student</option><option>Alumni</option><option>Faculty</option><option>Professional</option></select></div><div class="field"><label>Join as *</label><select class="select" name="joinAs"><option>Student</option><option>Senior</option><option>Alumni</option><option>Client</option></select></div><div class="field"><label>Skills / Interests</label><input class="input" name="skills" placeholder="CAD, AI, merchandising, forecasting..."></div><div class="field"><label>LinkedIn URL</label><input class="input" name="linkedin" placeholder="https://linkedin.com/in/..."></div><div class="field"><label>Portfolio URL</label><input class="input" name="portfolio" placeholder="https://..."></div><div class="field full"><label>Short Bio</label><textarea class="textarea" name="bio" placeholder="What do you create or want to learn?"></textarea></div><div class="field"><label>Password *</label><input class="input" name="password" type="password" minlength="6" required placeholder="Minimum 6 characters"></div><div class="field"><label>Profile Picture</label><div class="filebox"><input type="file" name="profilePicture" accept="image/*"><div class="small">Optional · max 15MB</div></div></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create VENZNOVA profile →</button></div></form>`:`<form onsubmit="submitLogin(event)"><div class="field"><label>Email *</label><input id="loginEmail" class="input" type="email" required placeholder="you@example.com"></div><div class="field" style="margin-top:14px"><label>Password *</label><input id="loginPassword" class="input" type="password" required placeholder="Your password"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Log in →</button></div></form>`}`)}
async function fileJson(input){const f=input?.files?.[0];if(!f)return null;return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,data:r.result});r.onerror=reject;r.readAsDataURL(f)})}
async function submitSignup(e){e.preventDefault();try{const fd=new FormData(e.target);const x=Object.fromEntries(fd.entries());x.profilePicture=await fileJson(e.target.profilePicture);const d=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});const j=await d.json();if(!d.ok)throw new Error(j.error);state.token=j.token;state.user=j.user;localStorage.setItem('vn_token',state.token);closeModal();toast('Profile created successfully.');render()}catch(x){toast(x.message,false)}}
async function submitLogin(e){e.preventDefault();try{const d=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#loginEmail').value,password:$('#loginPassword').value})});state.token=d.token;state.user=d.user;localStorage.setItem('vn_token',state.token);closeModal();toast('Welcome back.');render()}catch(x){toast(x.message,false)}}
async function logout(){try{await api('/auth/logout',{method:'POST'})}catch{}state.token='';state.user=null;localStorage.removeItem('vn_token');go('home');toast('Logged out.')}
function openProject(){if(!state.user)return openAuth('login');openModal(`<div class="modal-head"><div><div class="kicker">VENZNOVA / CREATE</div><h2>Publish your project.</h2><p class="auth-copy">Put your work in front of the NIFT network.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitProject(event)"><div class="formgrid"><div class="field full"><label>Project Title *</label><input class="input" name="title" required placeholder="e.g. AI-assisted fashion forecasting dashboard"></div><div class="field full"><label>Description *</label><textarea class="textarea" name="description" required placeholder="What did you build? What problem does it solve? What did you learn?"></textarea></div><div class="field"><label>Category</label><select class="select" name="category"><option>Fashion & Textiles</option><option>BFTech / Technology</option><option>Design</option><option>AI / Data</option><option>Merchandising</option><option>Communication</option></select></div><div class="field"><label>Visibility</label><select class="select" name="visibility"><option value="public">Public — visible to network</option><option value="private">Private — only me</option></select></div><div class="field full"><label>Skills / Tags</label><input class="input" name="skills" placeholder="AI, Python, CAD, textile, forecasting"></div><div class="field full"><label>Project file</label><div class="filebox"><input type="file" name="projectFile" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.doc,.docx,.ppt,.pptx,.zip"><div class="small">PDF, images, Word, PowerPoint or ZIP · max 15MB</div></div></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Publish project →</button></div></form>`)}
async function submitProject(e){e.preventDefault();try{const fd=new FormData(e.target);const x=Object.fromEntries(fd.entries());x.projectFile=await fileJson(e.target.projectFile);const d=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.token},body:JSON.stringify(x)});const j=await d.json();if(!d.ok)throw new Error(j.error);closeModal();toast('Project published — everyone can now discover it.');await loadProjects()}catch(x){toast(x.message,false)}}
function openDoubt(){openModal(`<div class="modal-head"><div><div class="kicker">VENZNOVA / DOUBT DESK</div><h2>Ask a doubt.</h2><p class="auth-copy">Make the question specific so the right person can help.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitDoubt(event)"><div class="field"><label>Title *</label><input class="input" name="title" required placeholder="e.g. How can I forecast fabric demand using Python?"></div><div class="field" style="margin-top:14px"><label>Description *</label><textarea class="textarea" name="description" required placeholder="Explain your question, what you tried and where you are stuck..."></textarea></div><div class="field" style="margin-top:14px"><label>Category</label><select class="select" name="category"><option>Academic</option><option>BFTech / Technical</option><option>Design</option><option>AI / Data</option><option>Career</option><option>General</option></select></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Post doubt →</button></div></form>`)}
async function submitDoubt(e){e.preventDefault();try{await api('/doubts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Doubt posted.');await loadDoubts()}catch(x){toast(x.message,false)}}
function openOpportunity(){openModal(`<div class="modal-head"><div><div class="kicker">VENZNOVA / OPPORTUNITIES</div><h2>Post an opportunity.</h2><p class="auth-copy">Share a real internship, job, freelance brief or collaboration.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitOpportunity(event)"><div class="formgrid"><div class="field full"><label>Title *</label><input class="input" name="title" required placeholder="e.g. Fashion AI Research Intern"></div><div class="field full"><label>Description *</label><textarea class="textarea" name="description" required placeholder="Role, responsibilities, requirements and how to apply..."></textarea></div><div class="field"><label>Type</label><select class="select" name="type"><option>Internship</option><option>Job</option><option>Freelance</option><option>Project</option><option>Collaboration</option></select></div><div class="field"><label>Location</label><input class="input" name="location" placeholder="Coimbatore / Mumbai / Remote"></div><div class="field"><label>Skills</label><input class="input" name="skills" placeholder="Python, fashion, CAD..."></div><div class="field"><label>Deadline</label><input class="input" name="deadline" type="date"></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Publish opportunity →</button></div></form>`)}
async function submitOpportunity(e){e.preventDefault();try{await api('/opportunities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Opportunity published.');await loadOpportunities()}catch(x){toast(x.message,false)}}
async function loadProjects(){const d=await api('/projects');state.projects=d.projects;drawProjects(state.projects)}
function filterProjects(q){const x=String(q||'').toLowerCase();drawProjects(state.projects.filter(p=>[p.title,p.description,p.category,p.skills,p.creator?.fullName].join(' ').toLowerCase().includes(x)))}
function drawProjects(items){const el=$('#projectGrid');if(!el)return;el.innerHTML=items.length?items.map(p=>`<article class="card"><div class="meta">${esc(p.category)} · ${new Date(p.createdAt).toLocaleDateString()}</div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><div class="tags">${String(p.skills||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">By <b>${esc(p.creator?.fullName||'Unknown')}</b> · ${esc(p.creator?.programme||'')}</div>${p.file?`<p><a class="link" href="${p.file.url}" target="_blank">Open project file ↗</a></p>`:''}<div class="card-actions"><button class="btn" onclick="likeProject('${p.id}')">♡ ${p.likes?.length||0}</button><button class="btn" onclick="messageUser('${p.creator?.id}')">Message creator</button></div></article>`).join(''):`<div class="empty">No public projects yet. Be the first student to publish your work.</div>`}
async function likeProject(id){try{const d=await api('/projects/'+id+'/like',{method:'POST'});toast(d.liked?'Project liked.':'Like removed.');await loadProjects()}catch(e){toast(e.message,false)}}
async function loadDoubts(){const d=await api('/doubts');state.doubts=d.doubts;drawDoubts(state.doubts)}function filterDoubts(q){const x=String(q||'').toLowerCase();drawDoubts(state.doubts.filter(d=>[d.title,d.description,d.category,d.creator?.fullName].join(' ').toLowerCase().includes(x)))}
function drawDoubts(items){const el=$('#doubtGrid');if(!el)return;el.innerHTML=items.length?items.map(d=>`<article class="card"><div class="meta">${esc(d.category)} · ${new Date(d.createdAt).toLocaleDateString()}</div><h3>${esc(d.title)}</h3><p>${esc(d.description)}</p><div class="meta">Asked by <b>${esc(d.creator?.fullName||'Unknown')}</b> · ${esc(d.creator?.programme||'')}</div><div class="answer"><b>${d.answers.length} answer${d.answers.length===1?'':'s'}</b>${d.answers.slice(0,2).map(a=>`<p><b>${esc(a.creator?.fullName)}</b>: ${esc(a.text)}</p>`).join('')}</div><div class="card-actions">${state.user?`<button class="btn primary" onclick="answerDoubt('${d.id}')">Answer</button>`:''}</div></article>`).join(''):`<div class="empty">No doubts yet. Ask the first question and start the conversation.</div>`}
function answerDoubt(id){const d=state.doubts.find(x=>x.id===id);openModal(`<div class="modal-head"><div><div class="kicker">DOUBT DESK</div><h2>${esc(d.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="auth-copy">${esc(d.description)}</p><form onsubmit="submitAnswer(event,'${id}')"><div class="field"><label>Your answer *</label><textarea class="textarea" name="text" required placeholder="Share a useful answer..."></textarea></div><div class="form-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Post answer →</button></div></form>`)}
async function submitAnswer(e,id){e.preventDefault();try{await api('/doubts/'+id+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:e.target.text.value})});closeModal();toast('Answer posted.');await loadDoubts()}catch(x){toast(x.message,false)}}
async function loadOpportunities(){const d=await api('/opportunities');state.opportunities=d.opportunities;drawOpportunities(state.opportunities)}function filterOpportunities(q){const x=String(q||'').toLowerCase();drawOpportunities(state.opportunities.filter(o=>[o.title,o.description,o.type,o.location,o.skills,o.creator?.fullName].join(' ').toLowerCase().includes(x)))}
function drawOpportunities(items){const el=$('#oppGrid');if(!el)return;el.innerHTML=items.length?items.map(o=>`<article class="card"><div class="meta">${esc(o.type)} · ${esc(o.location)}</div><h3>${esc(o.title)}</h3><p>${esc(o.description)}</p><div class="tags">${String(o.skills||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">Posted by <b>${esc(o.creator?.fullName||'Unknown')}</b>${o.deadline?' · Deadline '+esc(o.deadline):''}</div><div class="card-actions">${state.user?`<button class="btn primary" onclick="applyOpportunity('${o.id}')">Apply</button>`:`<button class="btn" onclick="openAuth('login')">Log in to apply</button>`}</div></article>`).join(''):`<div class="empty">No opportunities yet. Post an internship, job or project call.</div>`}
async function applyOpportunity(id){const msg=prompt('Optional message to the opportunity poster:','');try{await api('/opportunities/'+id+'/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg||''})});toast('Application submitted.');}catch(e){toast(e.message,false)}}
async function loadAssignments(){const d=await api('/assignments');state.assignments=d.assignments;drawAssignments(state.assignments)}
function filterAssignments(q){const x=String(q||'').toLowerCase();drawAssignments(state.assignments.filter(a=>[a.title,a.description,a.category,a.skills,a.poster?.fullName,a.worker?.fullName,a.status].join(' ').toLowerCase().includes(x)))}
function workflow(a){const order=['open','accepted','advance_paid','submitted','approved_payment_due','completed'];let stage=order.indexOf(a.status);if(a.status==='rework')stage=3;return `<div class="workflow">${['Posted','Accepted','Advance paid','Submitted / rework','Approved + final paid'].map((x,i)=>`<div class="step ${stage>=i?'on':''}">${i+1}. ${x}</div>`).join('')}</div>`}
function assignmentActions(a){if(!state.user)return `<button class="btn primary" onclick="openAuth('login')">Log in to accept</button>`;const mine=a.poster?.id===state.user.id,worker=a.worker?.id===state.user.id;let h='';if(a.status==='open'&&!mine)h+=`<button class="btn primary" onclick="acceptAssignment('${a.id}')">Accept assignment</button>`;if(a.status==='accepted'&&mine)h+=`<button class="btn primary" onclick="payAdvance('${a.id}')">Pay advance ₹${Math.round(a.budget*a.advancePercent/100).toLocaleString('en-IN')}</button>`;if(['advance_paid','rework'].includes(a.status)&&worker)h+=`<button class="btn primary" onclick="submitAssignment('${a.id}')">Submit work</button>`;if(a.status==='submitted'&&mine){h+=`<button class="btn primary" onclick="approveAssignment('${a.id}')">Approve & release final</button>`;if(a.reworksUsed<a.reworksAllowed)h+=`<button class="btn" onclick="requestRework('${a.id}')">Request rework (${a.reworksAllowed-a.reworksUsed} left)</button>`}if(a.status==='approved_payment_due'&&mine)h+=`<button class="btn primary" onclick="payFinal('${a.id}')">Pay remaining ₹${(a.budget-(a.advanceAmount||Math.round(a.budget*a.advancePercent/100))).toLocaleString('en-IN')}</button>`;if(a.assignmentFile)h+=`<a class="btn" href="${a.assignmentFile.url}" target="_blank">Open brief ↗</a>`;if(a.deliveryFile)h+=`<a class="btn" href="${a.deliveryFile.url}" target="_blank">Open delivery ↗</a>`;return h||`<span class="mutedline">${mine?'Waiting for someone to accept this assignment.':worker?'Waiting for the poster.':'This assignment is in progress.'}</span>`}
function drawAssignments(items){const el=$('#assignmentGrid');if(!el)return;el.innerHTML=items.length?items.map(a=>`<article class="assignment-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="status ${esc(a.status)}">${esc(a.status.replaceAll('_',' '))}</span><span class="money">₹${Number(a.budget).toLocaleString('en-IN')}</span></div><div class="meta">${esc(a.category)} · ${a.deadline?'Due '+esc(a.deadline):'Flexible deadline'}</div><h3>${esc(a.title)}</h3><p>${esc(a.description)}</p><div class="tags">${String(a.skills||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">Posted by <b>${esc(a.poster?.fullName||'Unknown')}</b> · ${esc(a.poster?.programme||'')} · Advance ${esc(a.advancePercent)}% · Reworks ${a.reworksUsed||0}/${a.reworksAllowed||3}</div>${a.worker?`<div class="meta">Worker: <b>${esc(a.worker.fullName)}</b></div>`:''}${workflow(a)}${a.reworkFeedback?.length?`<div class="noticebox"><b>Latest rework:</b> ${esc(a.reworkFeedback[a.reworkFeedback.length-1].text)}</div>`:''}${a.deliveryNote?`<div class="noticebox"><b>Delivery:</b> ${esc(a.deliveryNote)}</div>`:''}<div class="assignment-actions">${assignmentActions(a)}</div></article>`).join(''):`<div class="empty">No assignments yet. Post the first paid brief.</div>`}
function openAssignment(){if(!state.user)return openAuth('login');openModal(`<div class="modal-head"><div><div class="kicker">VENZNOVA / ASSIGNMENT MARKET</div><h2>Post a paid assignment.</h2><p class="auth-copy">Create a clear brief. The member who accepts becomes the worker, and the agreed advance is due before work starts.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitAssignmentPost(event)"><div class="formgrid"><div class="field full"><label>Assignment title *</label><input class="input" name="title" required placeholder="e.g. Create 20 tech-pack flats for a capsule collection"></div><div class="field full"><label>Brief / requirements *</label><textarea class="textarea" name="description" required placeholder="Explain exactly what needs to be completed, deliverables, references and quality expectations..."></textarea></div><div class="field"><label>Total budget (₹) *</label><input class="input" name="budget" type="number" min="1" required placeholder="15000"></div><div class="field"><label>Advance % *</label><input class="input" name="advancePercent" type="number" min="10" max="100" value="30" required></div><div class="field"><label>Category</label><select class="select" name="category"><option>Fashion / Design</option><option>BFTech / Technology</option><option>AI / Data</option><option>Textiles</option><option>CAD / Tech Pack</option><option>Merchandising</option><option>Content / Communication</option></select></div><div class="field"><label>Rework rounds</label><select class="select" name="reworksAllowed"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></div><div class="field"><label>Deadline</label><input class="input" name="deadline" type="date"></div><div class="field"><label>Skills / tags</label><input class="input" name="skills" placeholder="Illustrator, CAD, Python, forecasting..."></div><div class="field full"><label>Assignment brief file (optional)</label><input class="input" type="file" name="assignmentFile" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.ppt,.pptx,.zip"><div class="small">Attach references, specifications or a brief.</div></div></div><div class="paybox"><b>Payment rule</b><div class="small">The worker can start only after the poster pays the advance. After submission, the poster can approve or request up to the agreed rework limit. Once approved, the remaining balance is paid and the assignment is marked completed.</div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Publish assignment →</button></div></form>`)}
async function submitAssignmentPost(e){e.preventDefault();try{const fd=new FormData(e.target);const x=Object.fromEntries(fd.entries());x.budget=Number(x.budget);x.advancePercent=Number(x.advancePercent);x.reworksAllowed=Number(x.reworksAllowed);x.assignmentFile=await fileJson(e.target.assignmentFile);await api('/assignments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});closeModal();toast('Assignment published — members can now accept it.');await loadAssignments()}catch(e){toast(e.message,false)}}
async function assignmentAction(id,path,confirmText){if(confirmText&&!confirm(confirmText))return;try{await api('/assignments/'+id+'/'+path,{method:'POST',headers:{'Content-Type':'application/json'}});toast('Assignment updated.');await loadAssignments()}catch(e){toast(e.message,false)}}
async function acceptAssignment(id){await assignmentAction(id,'accept','Accept this assignment? You are agreeing to complete the brief for the posted budget.')} 
async function payAdvance(id){await assignmentAction(id,'advance','Pay the agreed advance now? This demo records the payment in VENZNOVA.')} 
async function approveAssignment(id){await assignmentAction(id,'approve','Approve this submission? The remaining payment will become due.')} 
async function payFinal(id){await assignmentAction(id,'final-payment','Pay the remaining balance and complete this assignment? This demo records the payment in VENZNOVA.')} 
async function requestRework(id){const feedback=prompt('Describe exactly what should be changed:','');if(!feedback?.trim())return;try{await api('/assignments/'+id+'/rework',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback:feedback.trim()})});toast('Rework request sent.');await loadAssignments()}catch(e){toast(e.message,false)}}
function submitAssignment(id){openModal(`<div class="modal-head"><div><div class="kicker">ASSIGNMENT DELIVERY</div><h2>Submit your work.</h2><p class="auth-copy">Add a clear delivery note and attach the completed work.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitAssignmentDelivery(event,'${id}')"><div class="field"><label>Delivery note *</label><textarea class="textarea" name="note" required placeholder="What is included, where to review it and any important notes..."></textarea></div><div class="field" style="margin-top:14px"><label>Completed file</label><input class="input" type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.ppt,.pptx,.zip"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Submit for review →</button></div></form>`)}
async function submitAssignmentDelivery(e,id){e.preventDefault();try{const fd=new FormData(e.target);const x={note:fd.get('note'),file:await fileJson(e.target.file)};await api('/assignments/'+id+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});closeModal();toast('Work submitted for review.');await loadAssignments()}catch(e){toast(e.message,false)}}
async function loadUsers(){const d=await api('/users');state.users=d.users;drawUsers(state.users)}function filterUsers(q){const x=String(q||'').toLowerCase();const prog=$('#programmeFilter')?.value||'all';drawUsers(state.users.filter(u=>(!x||[u.fullName,u.rollNumber,u.programme,u.skills,u.bio].join(' ').toLowerCase().includes(x))&&(prog==='all'||u.programme===prog)))}
function drawUsers(items){const el=$('#userGrid');if(!el)return;el.innerHTML=items.length?items.map(u=>`<article class="card"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${initials(u.fullName)}</div><div><h3 style="margin:0">${esc(u.fullName)}</h3><div class="meta">${esc(u.programme)} · ${esc(u.status)} · ${esc(u.graduationYear)}</div></div></div><p class="small" style="margin-top:16px"><b>Roll No:</b> ${esc(u.rollNumber)}</p><p>${esc(u.bio||'No bio added yet.')}</p><div class="tags">${String(u.skills||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="card-actions">${state.user&&u.id!==state.user.id?`<button class="btn primary" onclick="connectUser('${u.id}')">Connect</button><button class="btn" onclick="messageUser('${u.id}')">Message</button>`:''}${u.portfolio?`<a class="btn" href="${esc(u.portfolio)}" target="_blank">Portfolio ↗</a>`:''}</div></article>`).join(''):`<div class="empty">No members match your search.</div>`}
async function connectUser(id){try{await api('/connections/'+id,{method:'POST'});toast('Connection created.');await loadUsers()}catch(e){toast(e.message,false)}}
function messageUser(id){if(!state.user)return openAuth('login');go('messages');setTimeout(()=>selectChat(id),250)}
async function loadConnections(){const d=await api('/connections');state.connections=d.connections;const el=$('#people');if(!el)return;el.innerHTML=state.connections.length?state.connections.map(u=>`<div class="person ${state.selectedChat===u.id?'active':''}" onclick="selectChat('${u.id}')"><b>${esc(u.fullName)}</b><div class="meta">${esc(u.programme)} · ${esc(u.rollNumber)}</div></div>`).join(''):`<div class="empty">No conversations yet.<br><br>Connect with someone in Network first.</div>`}
async function selectChat(id){state.selectedChat=id;await loadConnections();const u=state.connections.find(x=>x.id===id);$('#chatTitle').textContent=u?u.fullName:'Conversation';const d=await api('/messages?userId='+encodeURIComponent(id));$('#messages').innerHTML=d.messages.length?d.messages.map(m=>`<div class="bubble ${m.from===state.user.id?'mine':''}">${esc(m.text)}<div style="font-size:9px;opacity:.55;margin-top:5px">${new Date(m.createdAt).toLocaleString()}</div></div>`).join(''):'<div class="empty">No messages yet. Say hello.</div>';$('#messages').scrollTop=$('#messages').scrollHeight}
async function sendMessage(){if(!state.selectedChat)return toast('Select a connection first.',false);const input=$('#messageInput');const text=input.value.trim();if(!text)return;try{await api('/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:state.selectedChat,text})});input.value='';await selectChat(state.selectedChat)}catch(e){toast(e.message,false)}}
async function loadDashboard(){const d=await api('/dashboard');const c=$('#dashboardContent');if(!c)return;c.innerHTML=`<div class="statgrid"><div class="stat"><div class="meta">PROJECTS</div><strong>${d.projects.length}</strong></div><div class="stat"><div class="meta">DOUBTS</div><strong>${d.doubts.length}</strong></div><div class="stat"><div class="meta">ASSIGNMENTS</div><strong>${d.assignments?.length||0}</strong></div><div class="stat"><div class="meta">APPLICATIONS</div><strong>${d.applications.length}</strong></div><div class="stat"><div class="meta">CONNECTIONS</div><strong>${d.connections.length}</strong></div></div><section class="section"><div class="profile"><div class="profile-card"><div class="profile-big">${initials(state.user.fullName)}</div><h2 style="margin:0 0 6px">${esc(state.user.fullName)}</h2><div class="meta">${esc(state.user.programme)} · ${esc(state.user.status)} · ${esc(state.user.graduationYear)}</div><p class="small"><b>Roll No:</b> ${esc(state.user.rollNumber)}</p><p>${esc(state.user.bio||'Add a bio to tell people what you create and want to learn.')}</p><div class="tags">${String(state.user.skills||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div><h2>Recent notifications</h2>${d.notifications.length?d.notifications.slice(0,8).map(n=>`<div class="application"><b>${esc(n.type)}</b><p>${esc(n.text)}</p><div class="meta">${new Date(n.createdAt).toLocaleString()}</div></div>`).join(''):'<div class="empty">You are all caught up.</div>'}</div></div></section><section class="section"><div class="section-head"><div><div class="kicker">YOUR WORK</div><h2>Published projects.</h2></div><button class="btn primary" onclick="openProject()">Upload another</button></div><div class="cards">${d.projects.length?d.projects.map(p=>`<div class="card"><div class="meta">${esc(p.category)}</div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>${p.file?`<a class="link" href="${p.file.url}" target="_blank">Open file ↗</a>`:''}</div>`).join(''):'<div class="empty">You have not published a project yet.</div>'}</div></section>`}
</script>
</body>
</html>
