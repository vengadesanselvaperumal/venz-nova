<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VENZNOVA — NIFT/CONNECT</title>

<meta
  name="description"
  content="VENZNOVA — NIFT student, senior, alumni and client network for projects, assignments, doubts, opportunities and connections."
>

<style>
:root{
  --bg:#07090d;
  --panel:#0d1118;
  --panel2:#111721;
  --line:#27303d;
  --text:#f6f7fb;
  --muted:#8d98a9;
  --lime:#b7ff00;
  --pink:#ff2da0;
  --cyan:#20d9ff;
  --danger:#ff6178;
  --max:1240px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 8% 15%,
      rgba(255,45,160,.11),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 55%,
      rgba(183,255,0,.10),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.app{
  min-height:100vh;
}

/* =========================
   NAVIGATION
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:76px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(7,9,13,.88);
  backdrop-filter:blur(18px);
}

.nav{
  height:100%;
  max-width:var(--max);
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  gap:28px;
}

.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
  color:var(--text);
  text-decoration:none;
  font-weight:900;
  letter-spacing:.5px;
  margin-right:auto;
}

.brandmark{
  width:36px;
  height:36px;
  flex:0 0 36px;
  display:grid;
  place-items:center;
  font-size:24px;
  font-weight:1000;
  background:linear-gradient(
    135deg,
    var(--lime),
    #ff4cae
  );
  color:#07100b;
  clip-path:polygon(
    24% 0,
    78% 0,
    100% 50%,
    78% 100%,
    24% 100%,
    0 50%
  );
}

.brand-name{
  min-width:0;
  white-space:nowrap;
}

.brand-name strong{
  display:block;
  font-size:16px;
  line-height:1.05;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:8px;
  letter-spacing:2px;
  margin-top:3px;
}

.navlinks{
  display:flex;
  gap:4px;
  align-items:center;
}

.navlinks a{
  color:#aab3c2;
  text-decoration:none;
  padding:10px 12px;
  border-radius:10px;
  font-size:14px;
  white-space:nowrap;
}

.navlinks a:hover,
.navlinks a.active{
  color:#fff;
  background:#121720;
}

.nav-actions{
  display:flex;
  gap:9px;
  align-items:center;
  flex-shrink:0;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #334050;
  background:var(--lime);
  color:#07100b;
  display:grid;
  place-items:center;
  font-weight:900;
  padding:0;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid var(--line);
  background:#10151d;
  color:#fff;
  border-radius:11px;
  padding:12px 17px;
  font-weight:750;
  transition:
    transform .18s,
    border-color .18s,
    background .18s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#536174;
}

.btn.primary{
  background:var(--lime);
  color:#07100b;
  border-color:var(--lime);
}

.btn.ghost{
  background:transparent;
}

.btn.danger{
  border-color:#6e2c3b;
  color:#ff9bab;
}

/* =========================
   PAGE
========================= */

.page{
  width:100%;
  max-width:var(--max);
  margin:auto;
  padding:56px 24px 100px;
}

.shell{
  max-width:var(--max);
  margin:auto;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:610px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:40px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  gap:8px;
  align-items:center;
  border:1px solid rgba(255,45,160,.4);
  color:#ff9bd2;
  background:rgba(255,45,160,.07);
  border-radius:999px;
  padding:9px 13px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.8px;
}

.dot{
  width:7px;
  height:7px;
  background:var(--pink);
  border-radius:50%;
  box-shadow:0 0 16px var(--pink);
}

h1{
  font-size:clamp(54px,7vw,94px);
  line-height:.94;
  letter-spacing:-5px;
  margin:28px 0;
  max-width:100%;
  overflow-wrap:anywhere;
}

.accent{
  color:var(--lime);
}

.lead{
  max-width:700px;
  color:#aab4c3;
  font-size:18px;
  line-height:1.65;
}

.hero-actions{
  display:flex;
  gap:12px;
  margin-top:28px;
  flex-wrap:wrap;
}

/* =========================
   ORBIT
========================= */

.orbit{
  min-height:470px;
  position:relative;
  display:grid;
  place-items:center;
}

.ring{
  position:absolute;
  border:1px solid rgba(183,255,0,.25);
  border-radius:50%;
  width:440px;
  height:440px;
}

.ring.r2{
  width:340px;
  height:340px;
  border-color:rgba(32,217,255,.28);
}

.ring.r3{
  width:230px;
  height:230px;
  border-color:rgba(255,45,160,.35);
}

.core{
  width:210px;
  height:240px;
  background:
    linear-gradient(
      150deg,
      #121923,
      #090d13
    );
  border:1px solid #2b3542;
  border-radius:26px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.core .v{
  font-size:94px;
  font-weight:1000;
  background:
    linear-gradient(
      135deg,
      #f94e9e,
      var(--lime)
    );
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text;
}

.core span{
  font-size:10px;
  color:#778295;
  letter-spacing:1.5px;
}

.float{
  position:absolute;
  background:#111720;
  border:1px solid #303a49;
  border-radius:14px;
  padding:14px 17px;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  font-size:13px;
}

.float b{
  display:block;
  margin-bottom:3px;
}

.f1{
  top:8%;
  left:4%;
}

.f2{
  top:22%;
  right:-2%;
}

.f3{
  bottom:14%;
  right:3%;
}

/* =========================
   SECTIONS
========================= */

.section{
  padding:65px 0;
}

.section-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:end;
  margin-bottom:24px;
}

.kicker{
  font-size:11px;
  color:#7e899b;
  letter-spacing:2px;
  font-weight:900;
}

.section h2{
  font-size:46px;
  letter-spacing:-2px;
  margin:8px 0 0;
}

/* =========================
   GRID
========================= */

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.feature{
  padding:25px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(17,23,33,.92),
      rgba(10,13,18,.92)
    );
  min-height:180px;
}

.feature h3{
  margin:12px 0 7px;
}

.feature p{
  color:var(--muted);
  line-height:1.55;
}

.icon{
  font-size:26px;
  color:var(--lime);
}

/* =========================
   PAGE TITLE
========================= */

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:25px;
}

.page-title > div{
  min-width:0;
}

.page-title h1{
  font-size:58px;
  letter-spacing:-3px;
  margin:10px 0 0;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:grid;
  grid-template-columns:1.4fr .6fr;
  gap:12px;
  margin-bottom:22px;
}

.input,
.textarea,
.select{
  width:100%;
  background:#090e15;
  color:#fff;
  border:1px solid #293342;
  border-radius:11px;
  padding:13px 14px;
  outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:#65748a;
  box-shadow:
    0 0 0 3px rgba(183,255,0,.06);
}

.textarea{
  min-height:130px;
  resize:vertical;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.card{
  min-width:0;
  background:
    linear-gradient(
      160deg,
      #0e141c,
      #0a0e14
    );
  border:1px solid #26303d;
  border-radius:17px;
  padding:20px;
  overflow:hidden;
}

.card h3{
  margin:8px 0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.card p{
  color:#9ca7b6;
  line-height:1.55;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.meta{
  max-width:100%;
  font-size:12px;
  color:#748095;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:14px 0;
}

.tag{
  font-size:11px;
  border:1px solid #2e3948;
  border-radius:999px;
  padding:5px 8px;
  color:#aeb8c7;
  max-width:100%;
  overflow-wrap:anywhere;
}

.empty{
  border:1px dashed #2c3643;
  border-radius:16px;
  padding:50px;
  text-align:center;
  color:#778397;
  grid-column:1/-1;
}

.card-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(10px);
  z-index:50;
  display:grid;
  place-items:center;
  padding:20px;
}

.modal{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:#0c1118;
  border:1px solid #2c3745;
  border-radius:20px;
  padding:28px;
  box-shadow:0 40px 100px #000;
}

.modal.large{
  width:min(900px,100%);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:20px;
}

.close{
  border:0;
  background:transparent;
  color:#8f9aaa;
  font-size:25px;
}

.modal h2{
  font-size:36px;
  letter-spacing:-1px;
  margin:8px 0;
}

.auth-copy{
  color:#8f9aaa;
  line-height:1.5;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  min-width:0;
}

.field label{
  display:block;
  font-size:12px;
  color:#9aa5b5;
  margin:0 0 7px;
  font-weight:700;
}

.field.full{
  grid-column:1/-1;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}

.tabs{
  display:flex;
  gap:8px;
  margin:18px 0;
}

.tab{
  flex:1;
  padding:12px;
  border:1px solid #2a3441;
  border-radius:10px;
  background:#0b1017;
  color:#9aa5b5;
}

.tab.active{
  background:var(--lime);
  border-color:var(--lime);
  color:#07100b;
  font-weight:900;
}

/* =========================
   PROFILE
========================= */

.profile{
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:22px;
}

.profile-card{
  min-width:0;
  background:#0e141c;
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px;
  overflow:hidden;
}

.profile-big{
  width:90px;
  height:90px;
  border-radius:50%;
  background:var(--lime);
  color:#07100b;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:16px;
}

.profile-name{
  font-size:30px;
  line-height:1.08;
  letter-spacing:-1px;
  margin:0 0 8px;
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
  white-space:normal;
}

.profile-card h2{
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.profile-card p{
  overflow-wrap:anywhere;
  word-break:break-word;
}

/* =========================
   STATS
========================= */

.statgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  min-width:0;
  border:1px solid var(--line);
  background:#0e141c;
  padding:18px;
  border-radius:15px;
  overflow:hidden;
}

.stat strong{
  font-size:27px;
}

/* =========================
   SPLIT
========================= */

.split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

/* =========================
   CHAT
========================= */

.chat{
  display:grid;
  grid-template-columns:280px minmax(0,1fr);
  height:620px;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:#0a0f15;
}

.chat-side{
  border-right:1px solid var(--line);
  padding:16px;
  overflow:auto;
}

.person{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  overflow:hidden;
}

.person:hover,
.person.active{
  background:#151c26;
}

.person b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  padding:22px;
  overflow:auto;
}

.bubble{
  max-width:72%;
  padding:11px 14px;
  border-radius:14px;
  margin-bottom:10px;
  background:#151d27;
  color:#dce2ea;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.bubble.mine{
  margin-left:auto;
  background:var(--lime);
  color:#07100b;
}

.composer{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line);
}

.composer .input{
  flex:1;
}

/* =========================
   NOTICES
========================= */

.notice{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:80;
  background:#131a23;
  border:1px solid #364252;
  padding:13px 16px;
  border-radius:12px;
  box-shadow:0 20px 50px #000;
  max-width:360px;
}

.notice.ok{
  border-color:#719c1a;
}

.notice.err{
  border-color:#8c3344;
}

.hidden{
  display:none!important;
}

.filebox{
  border:1px dashed #394555;
  border-radius:12px;
  padding:15px;
}

.small{
  font-size:12px;
  color:#748095;
}

.link{
  color:var(--lime);
  text-decoration:none;
  overflow-wrap:anywhere;
}

.answer{
  border-top:1px solid #242e3a;
  padding-top:14px;
  margin-top:14px;
}

.role{
  color:#a6b0bf;
}

.application{
  padding:14px;
  border:1px solid #283340;
  border-radius:12px;
  margin-bottom:10px;
}

/* =========================
   ASSIGNMENTS
========================= */

.assignment-card{
  min-width:0;
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(17,23,33,.96),
      rgba(8,11,16,.96)
    );
  border-radius:18px;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}

.status{
  display:inline-flex;
  width:max-content;
  max-width:100%;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  overflow-wrap:anywhere;
}

.status.open{
  border-color:rgba(183,255,0,.35);
  color:var(--lime);
}

.status.accepted,
.status.advance_paid,
.status.rework{
  border-color:rgba(32,217,255,.35);
  color:var(--cyan);
}

.status.submitted,
.status.approved_payment_due{
  border-color:rgba(255,45,160,.35);
  color:#ff8bc9;
}

.status.completed{
  border-color:rgba(183,255,0,.5);
  color:var(--lime);
}

.money{
  font-size:22px;
  font-weight:900;
  white-space:nowrap;
}

.workflow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:18px 0;
}

.step{
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
}

.step.on{
  border-color:var(--lime);
  color:var(--text);
  background:rgba(183,255,0,.06);
}

.assignment-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:auto;
}

.noticebox{
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.02);
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.paybox{
  border:1px solid rgba(183,255,0,.28);
  background:rgba(183,255,0,.05);
  padding:16px;
  border-radius:14px;
}

.mutedline{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   FOOTER
========================= */

.footer{
  border-top:1px solid var(--line);
  padding:28px 24px;
  color:#657082;
  text-align:center;
  font-size:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

  .nav{
    gap:14px;
  }

  .navlinks a{
    padding:9px 8px;
    font-size:13px;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .grid3{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:900px){

  .hero{
    grid-template-columns:1fr;
  }

  .orbit{
    display:none;
  }

  .navlinks{
    display:none;
  }

  .profile{
    grid-template-columns:1fr;
  }

  .chat{
    grid-template-columns:1fr;
  }

  .chat-side{
    display:none;
  }

  .statgrid{
    grid-template-columns:1fr 1fr;
  }

  .workflow{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:700px){

  .page{
    padding:35px 15px 80px;
  }

  .nav{
    padding:0 15px;
  }

  .nav-actions .btn{
    display:none;
  }

  .brand-name strong{
    font-size:14px;
  }

  h1{
    letter-spacing:-3px;
  }

  .page-title{
    display:block;
  }

  .page-title .btn{
    margin-top:18px;
  }

  .page-title h1{
    font-size:44px;
  }

  .cards,
  .grid3,
  .split,
  .formgrid,
  .toolbar{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .modal{
    padding:20px;
  }

  .section h2{
    font-size:37px;
  }

  .statgrid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:480px){

  .brand small{
    font-size:7px;
    letter-spacing:1.5px;
  }

  .brandmark{
    width:32px;
    height:32px;
    flex-basis:32px;
    font-size:21px;
  }

  .avatar{
    width:38px;
    height:38px;
  }

  .page-title h1{
    font-size:38px;
    letter-spacing:-2px;
  }

  .hero{
    min-height:auto;
  }

  .hero-actions{
    flex-direction:column;
  }

  .hero-actions .btn{
    width:100%;
  }

  .cards{
    grid-template-columns:1fr;
  }

/* =========================================================
   VENZNOVA FASHION-TECH INTERACTION LAYER
   Visual upgrade only — existing template + API logic preserved.
========================================================= */
:root{
  --vn-navy:#070b18;
  --vn-navy2:#0d1230;
  --vn-pink:#ff2fa7;
  --vn-purple:#8d5cff;
  --vn-blue:#35c8ff;
  --vn-white:#f8f8ff;
  --vn-glass:rgba(255,255,255,.055);
  --vn-glass2:rgba(255,255,255,.085);
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(900px 500px at 7% 5%,rgba(255,47,167,.16),transparent 62%),
    radial-gradient(800px 520px at 95% 20%,rgba(141,92,255,.15),transparent 60%),
    radial-gradient(700px 500px at 50% 100%,rgba(53,200,255,.08),transparent 65%),
    linear-gradient(135deg,#050711 0%,#080c1c 42%,#0a0715 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}

body::after{
  content:"";
  position:fixed;
  width:520px;
  height:520px;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:0;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,47,167,.055),transparent 68%);
  filter:blur(18px);
  animation:vn-breathe 8s ease-in-out infinite;
}

.app,.topbar,.footer{position:relative;z-index:1}

.topbar{
  background:rgba(5,7,17,.72)!important;
  border-bottom:1px solid rgba(255,255,255,.09)!important;
  box-shadow:0 12px 50px rgba(0,0,0,.18);
}

.topbar::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--vn-pink),var(--vn-purple),transparent);
  opacity:.65;
}

.brandmark{
  position:relative;
  background:linear-gradient(135deg,var(--vn-pink),var(--vn-purple))!important;
  box-shadow:0 0 28px rgba(255,47,167,.28),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;
}
.brand:hover .brandmark{transform:rotate(-7deg) scale(1.08)}

.brand-name strong{
  background:linear-gradient(90deg,#fff 15%,#ffb4df 55%,#b9a2ff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent!important;
}

.navlinks a{
  position:relative;
  transition:color .25s,transform .25s;
}
.navlinks a::after{
  content:"";
  position:absolute;
  left:50%;
  right:50%;
  bottom:-9px;
  height:2px;
  border-radius:9px;
  background:linear-gradient(90deg,var(--vn-pink),var(--vn-purple));
  transition:left .25s,right .25s;
}
.navlinks a:hover{transform:translateY(-1px);color:#fff!important}
.navlinks a:hover::after{left:10%;right:10%}

.page,.section,.hero,.home-dash,.card,.feature,.profile-card,.assignment-card,.modal,.auth-copy,.chat,.noticebox{position:relative}

.page::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  top:20px;
  right:-130px;
  border:1px solid rgba(255,47,167,.12);
  border-radius:50%;
  box-shadow:0 0 0 22px rgba(141,92,255,.025),0 0 0 46px rgba(53,200,255,.018);
  pointer-events:none;
}

.hero{
  isolation:isolate;
  overflow:hidden;
  background:
    linear-gradient(120deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),
    radial-gradient(circle at 76% 22%,rgba(255,47,167,.18),transparent 30%),
    radial-gradient(circle at 93% 80%,rgba(141,92,255,.16),transparent 33%)!important;
  border:1px solid rgba(255,255,255,.10)!important;
  box-shadow:0 28px 80px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);
}

.hero::before{
  content:"";
  position:absolute;
  inset:-30% -10%;
  background:
    repeating-linear-gradient(112deg,transparent 0 44px,rgba(255,255,255,.035) 45px,transparent 46px 92px);
  transform:rotate(-7deg);
  pointer-events:none;
  opacity:.55;
}

.hero::after{
  content:"VN / 01";
  position:absolute;
  right:28px;
  top:22px;
  font-size:11px;
  letter-spacing:.28em;
  color:rgba(255,255,255,.38);
  font-weight:800;
  pointer-events:none;
}

.eyebrow,.kicker{
  letter-spacing:.18em!important;
  text-transform:uppercase;
}

.hero h1,.page-title{
  text-wrap:balance;
  letter-spacing:-.035em;
}

.hero h1{
  background:linear-gradient(110deg,#fff 15%,#ffd5ee 46%,#c5b8ff 76%,#fff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  background-size:220% auto;
  animation:vn-shimmer 7s linear infinite;
}

.btn{
  position:relative;
  overflow:hidden;
  border-radius:13px!important;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease!important;
}
.btn::before{
  content:"";
  position:absolute;
  top:-80%;
  left:-35%;
  width:25%;
  height:260%;
  transform:rotate(24deg) translateX(-220%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent);
  transition:transform .65s ease;
  pointer-events:none;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.25)!important}
.btn:hover::before{transform:rotate(24deg) translateX(620%)}
.btn.primary{
  background:linear-gradient(135deg,var(--vn-pink),var(--vn-purple))!important;
  border-color:transparent!important;
  box-shadow:0 8px 28px rgba(255,47,167,.22);
}

.card,.feature,.profile-card,.assignment-card,.home-dash,.chat,.noticebox,.paybox,.filebox{
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025))!important;
  border-color:rgba(255,255,255,.09)!important;
  box-shadow:0 18px 55px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.045);
  backdrop-filter:blur(14px);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s,background .35s;
}

.card:hover,.feature:hover,.profile-card:hover,.assignment-card:hover{
  border-color:rgba(255,47,167,.28)!important;
  box-shadow:0 25px 70px rgba(0,0,0,.25),0 0 0 1px rgba(255,47,167,.04),inset 0 1px 0 rgba(255,255,255,.07);
}

.card::after,.feature::after,.profile-card::after,.assignment-card::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-70px;
  bottom:-70px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,47,167,.12),transparent 68%);
  pointer-events:none;
  transition:transform .4s ease;
}
.card:hover::after,.feature:hover::after,.profile-card:hover::after,.assignment-card:hover::after{transform:scale(1.7)}

.metric,.stat{
  border-color:rgba(255,255,255,.08)!important;
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.02))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
}

.metric strong,.stat strong,.money{
  background:linear-gradient(90deg,#fff,#ff9bd4,#b7a5ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent!important;
}

.input,.select,textarea,input,select{
  transition:border-color .22s,box-shadow .22s,background .22s,transform .22s;
}
.input:focus,.select:focus,textarea:focus,input:focus,select:focus{
  border-color:rgba(255,47,167,.65)!important;
  box-shadow:0 0 0 4px rgba(255,47,167,.09),0 12px 30px rgba(0,0,0,.14)!important;
  outline:none;
}

.tag{border-color:rgba(255,255,255,.12)!important}
.link{color:#ff77c2!important}

.footer{
  background:linear-gradient(180deg,rgba(8,10,22,.2),rgba(4,5,12,.92))!important;
  border-top:1px solid rgba(255,255,255,.08)!important;
  overflow:hidden;
}
.footer::before{
  content:"";
  position:absolute;
  width:500px;height:200px;
  left:50%;top:-150px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(255,47,167,.14),transparent 70%);
  pointer-events:none;
}

/* animated decorative floating objects */
.vn-orb,.vn-line,.vn-cursor,.vn-cursor-ring,.vn-progress{position:fixed;pointer-events:none}
.vn-orb{z-index:0;border-radius:50%;filter:blur(.2px);opacity:.55;mix-blend-mode:screen}
.vn-orb.one{width:10px;height:10px;background:#ff4aae;left:8%;top:38%;box-shadow:0 0 35px #ff4aae;animation:vn-float 7s ease-in-out infinite}
.vn-orb.two{width:7px;height:7px;background:#8d5cff;right:12%;top:28%;box-shadow:0 0 30px #8d5cff;animation:vn-float 9s ease-in-out infinite reverse}
.vn-orb.three{width:5px;height:5px;background:#35c8ff;left:45%;bottom:18%;box-shadow:0 0 28px #35c8ff;animation:vn-float 11s ease-in-out infinite}

.vn-progress{z-index:999;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,var(--vn-pink),var(--vn-purple),var(--vn-blue));box-shadow:0 0 14px rgba(255,47,167,.65);transition:width .08s linear}

.vn-cursor{z-index:9999;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;box-shadow:0 0 18px rgba(255,47,167,.9)}
.vn-cursor-ring{z-index:9998;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid rgba(255,110,196,.65);border-radius:50%;transition:width .18s,height .18s,margin .18s,border-color .18s,transform .08s}
body.vn-hover .vn-cursor-ring{width:52px;height:52px;margin:-26px 0 0 -26px;border-color:rgba(141,92,255,.9)}

.vn-reveal{opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.8,.2,1)}
.vn-reveal.vn-visible{opacity:1;transform:none}

.vn-spotlight{
  position:absolute!important;
  width:280px;height:280px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,47,167,.10),transparent 67%);
  transform:translate(-50%,-50%);
  opacity:0;
  transition:opacity .25s;
  z-index:0;
}
.vn-spotlight.active{opacity:1}

.vn-ripple{
  position:absolute;
  width:12px;height:12px;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  background:rgba(255,255,255,.35);
  pointer-events:none;
  animation:vn-ripple .6s ease-out forwards;
}

@keyframes vn-shimmer{to{background-position:-220% center}}
@keyframes vn-breathe{0%,100%{transform:translate(-50%,-50%) scale(.85);opacity:.55}50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}}
@keyframes vn-float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(20px,-35px,0)}}
@keyframes vn-ripple{to{transform:translate(-50%,-50%) scale(14);opacity:0}}

@media (max-width:900px){
  .page::before{display:none}
  .hero::after{right:16px;top:14px}
  .card,.feature,.profile-card,.assignment-card{transition:transform .2s ease,box-shadow .25s,border-color .25s}
}

@media (max-width:700px){
  body::before{background-size:34px 34px;opacity:.10}
  body::after{width:320px;height:320px}
  .vn-cursor,.vn-cursor-ring{display:none}
  .hero{box-shadow:0 18px 50px rgba(0,0,0,.22)!important}
  .hero h1{letter-spacing:-.045em}
  .btn:hover{transform:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
  .vn-cursor,.vn-cursor-ring,.vn-orb{display:none}
}

/* =========================================================

========================================================= */

const $ = selector =>
  document.querySelector(selector);

const esc = value =>
  String(value ?? "").replace(
    /[&<>'"]/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[char])
  );

function initials(name){

  return String(name || "V")
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();

}

function toast(message, ok = true){

  const element = document.createElement("div");

  element.className =
    "notice " +
    (ok ? "ok" : "err");

  element.textContent = message;

  const container = $("#toast");

  if(container){
    container.appendChild(element);

    setTimeout(() => {
      element.remove();
    },3500);
  }

}


/* =========================================================
   API
========================================================= */

const api = async(path,opt={}) => {

  const token = state.token || localStorage.getItem("vn_token") || "";
  const headers = {...(opt.headers || {})};
  if(token) headers.Authorization = "Bearer " + token;

  const controller = new AbortController();
  const timeout = Number(opt.timeout || 12000);
  const timer = setTimeout(() => controller.abort(), timeout);

  try{
    const response = await fetch("/api" + path,{
      ...opt,
      headers,
      credentials:"same-origin",
      signal:controller.signal
    });

    let data={};
    try{ data=await response.json(); }catch{}

    if(response.status===401){
      state.token="";
      state.user=null;
      localStorage.removeItem("vn_token");
      throw new Error(data.error || "Login required.");
    }

    if(!response.ok) throw new Error(data.error || "Request failed");
    return data;
  }catch(error){
    if(error?.name === "AbortError") throw new Error("Server is taking too long. Please try again.");
    throw error;
  }finally{
    clearTimeout(timer);
  }
};

function render(){

  const routes = {
    home,
    marketplace,
    assignments,
    doubts,
    opportunities,
    network,
    dashboard,
    messages
  };

  state.route =
    location.hash.replace("#/","") ||
    "home";

  if(!routes[state.route]){
    state.route = "home";
  }

  const app = $("#app");

  app.innerHTML =
    nav() +
    routes[state.route]() +
    footer();

  window.scrollTo(0,0);

  afterRender();

}


/* =========================================================
   AFTER RENDER
========================================================= */

async function afterRender(){

  try{

    if(state.route === "marketplace"){
      await loadProjects();
    }

    if(state.route === "assignments"){
      await loadAssignments();
    }

    if(state.route === "doubts"){
      await loadDoubts();
    }

    if(state.route === "opportunities"){
      await loadOpportunities();
    }

    if(state.route === "network"){
      await loadUsers();
    }

    if(state.route === "dashboard"){
      await loadDashboard();
    }

    if(state.route === "messages"){
      await loadConnections();
    }

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}


function go(route){

  location.hash =
    "#/" + route;

}

window.addEventListener(

);

  "DOMContentLoaded",
  () => {
    // Render the interface immediately. Never block the first paint on /api/me.
    render();

    if(state.token){
      api("/me", {timeout:6000})
        .then(data => {
          state.user = data.user;
          render();
        })
        .catch(() => {
          state.token = "";
          localStorage.removeItem("vn_token");

);

/* =========================================================
   FILE TO BASE64
========================================================= */

async function fileJson(input){

  const file =
    input?.files?.[0];

  if(!file){
    return null;
  }

  return await new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload = () =>
        resolve({
          name:file.name,
          data:reader.result
        });

      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   SIGNUP
========================================================= */

async function submitSignup(event){

  event.preventDefault();

  try{

    const form =
      new FormData(event.target);

    const data =
      Object.fromEntries(
        form.entries()
      );

    data.profilePicture =
      await fileJson(
        event.target.profilePicture
      );

    const response =
      await fetch(
        "/api/auth/signup",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify(data)
        }
      );

    const result =
      await response.json();

    if(!response.ok){
      throw new Error(
        result.error ||
        "Signup failed"
      );
    }

    state.token =
      result.token;

    state.user =
      result.user;

    localStorage.setItem(
      "vn_token",
      state.token
    );

    closeModal();

    toast(
      "Profile created successfully."
    );

    render();

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}

async function loadProjects(){

  const data =
    await api("/projects");

  state.projects =
    data.projects;

  drawProjects(
    state.projects
  );

}


function filterProjects(query){

  const text =
    String(query || "")
      .toLowerCase();

  drawProjects(
    state.projects.filter(
      project =>
        [
          project.title,
          project.description,
          project.category,
          project.skills,
          project.creator?.fullName
        ]
        .join(" ")
        .toLowerCase()
        .includes(text)
    )
  );

}


function drawProjects(items){

  const element =
    $("#projectGrid");

  if(!element){
    return;
  }

  element.innerHTML =
    items.length

    ?

    items.map(project => `

      <article class="card">

        <div class="meta">
          ${esc(project.category)}
          ·
          ${
            project.createdAt
            ? new Date(
                project.createdAt
              ).toLocaleDateString()
            : ""
          }
        </div>


        <h3>
          ${esc(project.title)}
        </h3>


        <p>
          ${esc(project.description)}
        </p>


        <div class="tags">

          ${
            String(
              project.skills || ""
            )
            .split(",")
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0,6)
            .map(
              tag =>

      Number(data.budget);

        event.target.assignmentFile

    await api(
      "/assignments",

        },

        ]

function workflow(assignment){

  const order = [
    "open",
    "accepted",
    "advance_paid",
    "submitted",
    "approved_payment_due",
    "completed"
  ];

  let stage =
    order.indexOf(
      assignment.status
    );

  if(
    assignment.status === "rework"
  ){
    stage = 3;
  }

  const labels = [
    "Posted",
    "Accepted",
    "Advance paid",
    "Submitted / rework",
    "Approved + final paid"
  ];

  return `

    <div class="workflow">

      ${
        labels.map(
          (label,index) => `
            <div
              class="step ${
                stage >= index
                ? "on"
                : ""
              }"
            >
              ${index + 1}.
              ${label}
            </div>
          `
        ).join("")
      }

    </div>

  `;

}


function assignmentActions(assignment){

  if(!state.user){

    return `
      <button
        class="btn primary"
        onclick="openAuth('login')"
      >
        Log in to accept
      </button>
    `;

  }

  const mine =
    assignment.poster?.id ===
    state.user.id;

  const worker =
    assignment.worker?.id ===
    state.user.id;

  let html = "";

  if(mine){
    html += `<button class="btn danger" onclick="deleteAssignment('${assignment.id}')">Delete</button>`;
  }

  if(
    assignment.status === "open" &&
    !mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="acceptAssignment('${assignment.id}')"
      >
        Accept assignment
      </button>
    `;

  }


  if(
    assignment.status === "accepted" &&
    mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="payAdvance('${assignment.id}')"
      >
        Pay advance ₹${
          Math.round(
            assignment.budget *
            assignment.advancePercent /
            100
          ).toLocaleString("en-IN")
        }
      </button>
    `;

  }


  if(
    [
      "advance_paid",
      "rework"
    ].includes(
      assignment.status
    ) &&
    worker
  ){

    html += `
      <button
        class="btn primary"
        onclick="submitAssignment('${assignment.id}')"
      >
        Submit work
      </button>
    `;

  }


  if(
    assignment.status === "submitted" &&
    mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="approveAssignment('${assignment.id}')"
      >
        Approve & release final
      </button>
    `;


    if(
      assignment.reworksUsed <
      assignment.reworksAllowed
    ){

      html += `
        <button
          class="btn"
          onclick="requestRework('${assignment.id}')"
        >
          Request rework
          (
          ${
            assignment.reworksAllowed -
            assignment.reworksUsed
          }
          left)
        </button>
      `;

    }

  }


  if(
    assignment.status ===
    "approved_payment_due" &&
    mine
  ){

    html += `
      <button
        class="btn primary"
        onclick="payFinal('${assignment.id}')"
      >
        Pay remaining ₹${
          (
            assignment.budget -
            (
              assignment.advanceAmount ||
              Math.round(
                assignment.budget *
                assignment.advancePercent /
                100
              )
            )
          ).toLocaleString("en-IN")
        }
      </button>
    `;

  }


  if(assignment.assignmentFile){

    html += `
      <a
        class="btn"
        href="${assignment.assignmentFile.url}"
        target="_blank"
        rel="noopener"
      >
        Open brief ↗
      </a>
    `;

  }


  if(assignment.deliveryFile){

    html += `
      <a
        class="btn"
        href="${assignment.deliveryFile.url}"
        target="_blank"
        rel="noopener"
      >
        Open delivery ↗
      </a>
    `;

  }


  if(!html){

    return `
      <span class="mutedline">

        ${
          mine
          ? "Waiting for someone to accept this assignment."
          : worker
          ? "Waiting for the poster."
          : "This assignment is in progress."
        }

      </span>
    `;

  }

  return html;

}

async function submitAssignmentDelivery(
  event,
  id
){

  event.preventDefault();

  try{

    const form =
      new FormData(event.target);

    const data = {
      note:
        form.get("note"),

      file:
        await fileJson(
          event.target.file
        )
    };

    await api(
      "/assignments/" +
      id +
      "/submit",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify(data)
      }
    );

    closeModal();

    toast(
      "Work submitted for review."
    );

    await loadAssignments();

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}

function filterUsers(query){

  const text =
    String(query || "")
      .toLowerCase();

  const programme =
    $("#programmeFilter")?.value ||
    "all";

  drawUsers(
    state.users.filter(
      user => {

        const matchesText =
          !text ||
          [
            user.fullName,
            user.rollNumber,
            user.programme,
            user.skills,
            user.bio
          ]
          .join(" ")
          .toLowerCase()
          .includes(text);

        const matchesProgramme =
          programme === "all" ||
          user.programme ===
            programme;

        return (
          matchesText &&
          matchesProgramme
        );

      }
    )
  );

}

async function selectChat(id){

  state.selectedChat =
    id;

  await loadConnections();

  const user =
    state.connections.find(
      x => x.id === id
    );

  $("#chatTitle").textContent =
    user
    ? user.fullName
    : "Conversation";

  const data =
    await api(
      "/messages?userId=" +
      encodeURIComponent(id)
    );

  $("#messages").innerHTML =
    data.messages.length

    ?

    data.messages.map(
      message => `

        <div
          class="
            bubble
            ${
              message.from ===
              state.user.id
              ? "mine"
              : ""
            }
          "
        >

          ${esc(
            message.text
          )}

          <div
            style="
              font-size:9px;
              opacity:.55;
              margin-top:5px;
            "
          >
            ${
              new Date(
                message.createdAt
              ).toLocaleString()
            }
          </div>

        </div>

      `
    ).join("")

    :

    `
      <div class="empty">
        No messages yet.
        Say hello.
      </div>
    `;

  $("#messages").scrollTop =
    $("#messages").scrollHeight;

}


async function sendMessage(){

  if(!state.selectedChat){

    return toast(
      "Select a connection first.",
      false
    );

  }

  const input =
    $("#messageInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  try{

    await api(
      "/messages",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          to:
            state.selectedChat,

          text
        })
      }
    );

    input.value = "";

    await selectChat(
      state.selectedChat
    );

  }catch(error){

    toast(
      error.message,
      false
    );

  }

}

/* =========================================================
   VENZNOVA NIFT HYPER — LIGHTWEIGHT MICRO-INTERACTIONS
   Performance-first: one cursor loop, no MutationObserver,
   no per-card pointer listeners, no duplicate effects.
========================================================= */
(function(){
  const boot=()=>{
    try{
      const fine=window.matchMedia && window.matchMedia('(pointer:fine)').matches;
      const body=document.body;

      if(!document.getElementById('vnProgress')){
        body.insertAdjacentHTML('afterbegin','<div class="vn-progress" id="vnProgress"></div>');
      }

      const progress=document.getElementById('vnProgress');
      const updateProgress=()=>{
        const h=document.documentElement.scrollHeight-window.innerHeight;
        if(progress) progress.style.width=(h>0?(window.scrollY/h)*100:0)+'%';
      };
      window.addEventListener('scroll',updateProgress,{passive:true});
      updateProgress();

      // Only one cursor animation loop on desktop.
      if(fine && !document.getElementById('vnCursor')){
        body.insertAdjacentHTML('beforeend','<div class="vn-cursor" id="vnCursor"></div><div class="vn-cursor-dot" id="vnCursorDot"></div>');
        const c=document.getElementById('vnCursor');
        const d=document.getElementById('vnCursorDot');
        let x=innerWidth/2,y=innerHeight/2,tx=x,ty=y;
        window.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;},{passive:true});
        const loop=()=>{
          x+=(tx-x)*.16; y+=(ty-y)*.16;
          c.style.transform=`translate3d(${x}px,${y}px,0)`;
          d.style.transform=`translate3d(${tx}px,${ty}px,0)`;
          requestAnimationFrame(loop);
        };
        loop();
        document.addEventListener('pointerover',e=>{
          if(e.target.closest('a,button,input,textarea,select,.card,.project-card,.opportunity-card,.assignment-card,.doubt-card,.user-card')) body.classList.add('vn-hover');
        },{passive:true});
        document.addEventListener('pointerout',e=>{
          if(e.target.closest('a,button,input,textarea,select,.card,.project-card,.opportunity-card,.assignment-card,.doubt-card,.user-card')) body.classList.remove('vn-hover');
        },{passive:true});
      }

      // Lightweight pointer lighting using CSS variables; one delegated listener.
      if(fine && !window.__vnLight){
        window.__vnLight=true;
        document.addEventListener('pointermove',e=>{
          const el=e.target.closest('.card,.project-card,.opportunity-card,.assignment-card,.doubt-card,.user-card');
          if(!el)return;
          const r=el.getBoundingClientRect();
          el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
          el.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
        },{passive:true});
      }

      // Reveal only the elements currently in the DOM. No observer.
      const reveal=()=>{
        document.querySelectorAll('.card,.feature,.profile-card,.assignment-card,.metric,.stat,.section,.home-dash,.project-card,.opportunity-card,.doubt-card,.user-card').forEach((el,i)=>{
          if(el.dataset.vnReady)return;
          el.dataset.vnReady='1';
          el.classList.add('vn-reveal');
          el.style.transitionDelay=Math.min((i%5)*35,140)+'ms';
          requestAnimationFrame(()=>el.classList.add('vn-visible'));
        });
      };

      // Runway graphic is static after insertion — no animation loop in JS.
      const hero=document.querySelector('.hero');
      if(hero && !hero.querySelector('.vn-orbit')){
        const o=document.createElement('div');
        o.className='vn-orbit';
        o.innerHTML='<i></i>';
        hero.appendChild(o);
      }

      reveal();
      window.addEventListener('hashchange',()=>setTimeout(reveal,0),{passive:true});

      // Ripple is event-delegated and tiny.
      if(!window.__vnRipple){
        window.__vnRipple=true;
        document.addEventListener('click',e=>{
          const target=e.target.closest('button,.btn,.tab');
          if(!target)return;
          const r=target.getBoundingClientRect();
          const rip=document.createElement('span');
          rip.className='vn-ripple';
          rip.style.left=(e.clientX-r.left)+'px';
          rip.style.top=(e.clientY-r.top)+'px';
          target.appendChild(rip);
          setTimeout(()=>rip.remove(),550);
        });
      }

      // Keyboard search shortcut.
      if(!window.__vnShortcut){
        window.__vnShortcut=true;
        document.addEventListener('keydown',e=>{
          if(e.key==='/' && !/input|textarea|select/i.test(document.activeElement?.tagName||'')){
            e.preventDefault();
            const field=[...document.querySelectorAll('input,textarea')].find(x=>x.offsetParent!==null);
            if(field)field.focus();
          }
        });
      }
    }catch(err){
      console.warn('VENZNOVA interaction layer skipped:',err);
    }
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
</script>
